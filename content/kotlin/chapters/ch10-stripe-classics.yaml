                  val allowed = mutableMapOf<String, ArrayDeque<Int>>()
                  return requests.map { request ->
                      val queue = allowed.getOrPut(request.merchant) { ArrayDeque() }
                      while (queue.firstOrNull()?.let { it <= request.timestamp - window } == true) queue.removeFirst()
                      if (queue.size < limit) {
                          queue.addLast(request.timestamp)
                          true
                      } else false
                  }
              }
