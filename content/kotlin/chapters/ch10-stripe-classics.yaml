          - question: Do same-second requests count separately?
            answer: Yes. Count each one.
          - question: Which window contains t = 10?
            answer: The fixed window `[10, 20)`.
          - question: Do denied requests count?
            answer: No.
          - question: Can timestamps go backwards?
            answer: Not in Parts 1–3.
        discussion: |
          Part 4: Ten million merchants. What grows without bound? Add eviction, and state the cost per request. A practical answer evicts inactive merchant queues after their last possible timestamp expires; with a deque, each timestamp is added and removed once, so the amortized cost per request is O(1), while memory is proportional to active merchants and their recent allowed requests.
