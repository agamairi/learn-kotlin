              blanks:
                - placeholder: ____1
                  accepted:
                    - val lineNumber = index + 2
                  options:
                    - val lineNumber = index + 1
                    - val lineNumber = index + 2
                    - val lineNumber = index
                    - val lineNumber = index + 3
                - placeholder: ____2
                  accepted:
                    - amount == null -> errors += FeeError(lineNumber, "amount is not a number")
                  options:
                    - amount == null -> errors += FeeError(lineNumber, "missing amount")
                    - amount == null -> errors += FeeError(index, "amount is not a number")
                    - amount == null -> errors += FeeError(lineNumber, "amount is not a number")
                    - amount == null -> Unit
                - placeholder: ____3
                  accepted:
                    - card != "visa" && card != "amex" -> errors += FeeError(lineNumber, "unknown card")
                  options:
                    - card != "visa" || card != "amex" -> errors += FeeError(lineNumber, "unknown card")
                    - card == "unknown" -> errors += FeeError(lineNumber, "unknown card")
                    - card != "visa" -> errors += FeeError(lineNumber, "unknown card")
                    - card != "visa" && card != "amex" -> errors += FeeError(lineNumber, "unknown card")
                - placeholder: ____4
                  accepted:
                    - val percentage = if (card == "amex") 350L else 290L
                  options:
                    - val percentage = if (card == "amex") 350L else 290L
                    - val percentage = if (card == "amex") 290L else 350L
                    - val percentage = 290L
                    - val percentage = if (card == "visa") 350L else 290L
              explanation: Validate row fields with exact line numbers, supporting brand-specific fee basis points (350 Amex vs 290 Visa).
            hints:
              - Validate and convert the amount before doing arithmetic, and remember that the header makes the first data row line 2.
              - Keep totals only for valid rows; choose the percentage from the normalized card name.
            expected: "Expected: tx2 fee 119 · acme fees 178, net 3372 · errors: line 5 \"amount is not a number\", line 6 \"missing merchant\""
          - id: ch10-card-fee-report-part-4
            prompt: |
              The CSV gains a fifth column, `type`: `charge` or `refund`. A refund subtracts from volume and gives back the percentage part of its fee but not the 30¢ (that is this exercise's rule).

                  id,merchant,amount_cents,card,type
                  tx1,acme,1000,visa,charge
                  tx2,acme,2550,amex,charge
                  tx3,bolt,99,visa,charge
                  tx6,acme,1000,visa,refund
            starter_code: |
              fun merchantFeeReportWithRefunds(csv: String): List<MerchantFeeReport> = TODO()
            hidden_tests: |
              import org.junit.Assert.assertEquals
              import org.junit.Test

              class CardFeeReportPart4Test {
                  @Test fun example() {
                      val csv = """id,merchant,amount_cents,card,type
              tx1,acme,1000,visa,charge
              tx2,acme,2550,amex,charge
              tx3,bolt,99,visa,charge
              tx6,acme,1000,visa,refund"""
                      assertEquals(
                          listOf(
                              MerchantFeeReport("acme", 2550, 149, 2401),
                              MerchantFeeReport("bolt", 99, 33, 66)
                          ),
                          merchantFeeReportWithRefunds(csv)
                      )
                  }
              }
            reference_solution: |
              data class TransactionFee(val id: String, val feeCents: Long)
              data class MerchantFeeReport(val merchant: String, val volumeCents: Long, val feesCents: Long, val netCents: Long)

              private fun percentageFee(amount: Long, basisPoints: Long): Long = (amount * basisPoints + 5_000) / 10_000

              fun transactionFees(csv: String): List<TransactionFee> = csv.lineSequence()
                  .drop(1).filter { it.isNotBlank() }.map { line ->
                      val fields = line.split(',')
                      TransactionFee(fields[0], percentageFee(fields[2].toLong(), 290) + 30)
                  }.toList()

              fun merchantFeeReport(csv: String): List<MerchantFeeReport> = csv.lineSequence()
                  .drop(1)
                  .filter { it.isNotBlank() }
                  .map { it.split(',') }
                  .groupBy { it[1] }
                  .map { (merchant, rows) ->
                      val volume = rows.sumOf { it[2].toLong() }
                      val fees = rows.sumOf { percentageFee(it[2].toLong(), 290) + 30 }
                      MerchantFeeReport(merchant, volume, fees, volume - fees)
                  }
                  .sortedWith(compareByDescending<MerchantFeeReport> { it.netCents }.thenBy { it.merchant })

              data class FeeError(val lineNumber: Int, val reason: String)
              data class FeeReportWithErrors(val reports: List<MerchantFeeReport>, val errors: List<FeeError>)

              fun merchantFeeReportWithErrors(csv: String): FeeReportWithErrors {
                  val totals = mutableMapOf<String, Pair<Long, Long>>()
                  val errors = mutableListOf<FeeError>()
                  csv.lineSequence().drop(1).forEachIndexed { index, line ->
                      if (line.isBlank()) return@forEachIndexed
                      val lineNumber = index + 2
                      val fields = line.split(',')
                      val merchant = fields.getOrNull(1).orEmpty()
                      val amount = fields.getOrNull(2)?.toLongOrNull()
                      val card = fields.getOrNull(3)?.lowercase()
                      when {
                          amount == null -> errors += FeeError(lineNumber, "amount is not a number")
                          merchant.isBlank() -> errors += FeeError(lineNumber, "missing merchant")
                          amount < 0 -> errors += FeeError(lineNumber, "negative amount")
                          card != "visa" && card != "amex" -> errors += FeeError(lineNumber, "unknown card")
                          else -> {
                              val percentage = if (card == "amex") 350L else 290L
                              val fee = percentageFee(amount, percentage) + 30
                              val old = totals[merchant] ?: (0L to 0L)
                              totals[merchant] = (old.first + amount) to (old.second + fee)
                          }
                      }
                  }
                  val reports = totals.map { (merchant, values) ->
                      MerchantFeeReport(merchant, values.first, values.second, values.first - values.second)
                  }.sortedWith(compareByDescending<MerchantFeeReport> { it.netCents }.thenBy { it.merchant })
                  return FeeReportWithErrors(reports, errors)
              }

              fun merchantFeeReportWithRefunds(csv: String): List<MerchantFeeReport> {
                  val totals = mutableMapOf<String, Pair<Long, Long>>()
                  csv.lineSequence().drop(1).filter { it.isNotBlank() }.forEach { line ->
                      val fields = line.split(',')
                      val merchant = fields[1]
                      val amount = fields[2].toLong()
                      val percentage = if (fields[3].lowercase() == "amex") 350L else 290L
                      val sign = if (fields[4].lowercase() == "refund") -1 else 1
                      val old = totals[merchant] ?: (0L to 0L)
                      totals[merchant] = (old.first + sign * amount) to
                          (old.second + sign * percentageFee(amount, percentage) + if (sign > 0) 30 else 0)
                  }
                  return totals.map { (merchant, values) ->
                      MerchantFeeReport(merchant, values.first, values.second, values.first - values.second)
                  }.sortedWith(compareByDescending<MerchantFeeReport> { it.netCents }.thenBy { it.merchant })
              }
