                  accepted:
                    - (amount * basisPoints + 5_000) / 10_000
                  options:
                    - (amount * basisPoints) / 10_000
                    - (amount * basisPoints + 500) / 10_000
                    - (amount * basisPoints + 5_000) / 1_000
                    - (amount * basisPoints + 5_000) / 10_000
                - placeholder: ____2
                  accepted:
                    - "csv.lineSequence()\n    .drop(1)"
                  options:
                    - "csv.lineSequence()\n    .drop(1)"
                    - "csv.lineSequence()\n    .take(1)"
                    - csv.lineSequence()
                    - "csv.lineSequence()\n    .dropLast(1)"
                - placeholder: ____3
                  accepted:
                    - percentageFee(fields[2].toLong(), 290) + 30
                  options:
                    - percentageFee(fields[2].toLong(), 290)
                    - percentageFee(fields[2].toLong(), 290) + 30
                    - percentageFee(fields[2].toLong(), 30) + 290
                    - fields[2].toLong() + 30
              explanation: Compute transaction fee by adding fixed 30 cents to 2.9% rounded basis points.
            hints:
              - Split the header off first and keep the transaction id with the calculated fee.
              - 2.9% is 290 basis points, so divide by 10_000; add 5_000 before the division to round half-up.
            expected: "Expected: tx1 → 59, tx2 → 104, tx3 → 33"
          - id: ch10-card-fee-report-part-2
            prompt: |
              Build a per-merchant report: volume (sum of amounts), fees, and net (volume − fees). Sort by net, highest first, breaking ties by merchant name.
            starter_code: |
              data class MerchantFeeReport(val merchant: String, val volumeCents: Long, val feesCents: Long, val netCents: Long)

              fun merchantFeeReport(csv: String): List<MerchantFeeReport> = TODO()
            hidden_tests: |
              import org.junit.Assert.assertEquals
              import org.junit.Test

              class CardFeeReportPart2Test {
                  @Test fun example() {
                      val csv = """id,merchant,amount_cents,card
              tx1,acme,1000,visa
              tx2,acme,2550,amex
              tx3,bolt,99,visa"""
                      assertEquals(
                          listOf(
                              MerchantFeeReport("acme", 3550, 163, 3387),
                              MerchantFeeReport("bolt", 99, 33, 66)
                          ),
                          merchantFeeReport(csv)
                      )
                  }
              }
            reference_solution: |
              data class TransactionFee(val id: String, val feeCents: Long)
              data class MerchantFeeReport(val merchant: String, val volumeCents: Long, val feesCents: Long, val netCents: Long)

              private fun percentageFee(amount: Long, basisPoints: Long): Long = (amount * basisPoints + 5_000) / 10_000

              fun transactionFees(csv: String): List<TransactionFee> = csv.lineSequence()
                  .drop(1).filter { it.isNotBlank() }.map { line ->
                      val fields = line.split(',')
                      TransactionFee(fields[0], percentageFee(fields[2].toLong(), 290) + 30)
                  }.toList()

              fun merchantFeeReport(csv: String): List<MerchantFeeReport> = csv.lineSequence()
                  .drop(1)
                  .filter { it.isNotBlank() }
                  .map { it.split(',') }
                  .groupBy { it[1] }
                  .map { (merchant, rows) ->
                      val volume = rows.sumOf { it[2].toLong() }
                      val fees = rows.sumOf { percentageFee(it[2].toLong(), 290) + 30 }
                      MerchantFeeReport(merchant, volume, fees, volume - fees)
                  }
                  .sortedWith(compareByDescending<MerchantFeeReport> { it.netCents }.thenBy { it.merchant })
            guided:
              template: "data class TransactionFee(val id: String, val feeCents: Long)\ndata class MerchantFeeReport(val merchant: String, val volumeCents: Long, val feesCents: Long, val netCents: Long)\n\nprivate fun percentageFee(amount: Long, basisPoints: Long): Long = (amount * basisPoints + 5_000) / 10_000\n\nfun transactionFees(csv: String): List<TransactionFee> = csv.lineSequence()\n    .drop(1).filter { it.isNotBlank() }.map { line ->\n        val fields = line.split(',')\n        TransactionFee(fields[0], percentageFee(fields[2].toLong(), 290) + 30)\n    }.toList()\n\nfun merchantFeeReport(csv: String): List<MerchantFeeReport> = csv.lineSequence()\n    .drop(1)\n    .filter { it.isNotBlank() }\n    .map { it.split(',') }\n    .groupBy { it[1] }\n    .map { (merchant, rows) ->\n        ____1\n        val fees = rows.sumOf { percentageFee(it[2].toLong(), 290) + 30 }\n        ____2\n    }\n    .sortedWith(____3)\n"
              blanks:
                - placeholder: ____1
                  accepted:
                    - val volume = rows.sumOf { it[2].toLong() }
                  options:
                    - val volume = rows.sumOf { it[0].toLong() }
                    - val volume = rows.map { it[2].toLong() }.count()
                    - val volume = rows.sumOf { it[2].toLong() }
                    - val volume = rows.first()[2].toLong()
                - placeholder: ____2
                  accepted:
                    - MerchantFeeReport(merchant, volume, fees, volume - fees)
                  options:
                    - MerchantFeeReport(merchant, volume, fees, volume + fees)
                    - MerchantFeeReport(merchant, fees, volume, volume - fees)
                    - MerchantFeeReport(merchant, volume, fees, netCents = 0L)
                    - MerchantFeeReport(merchant, volume, fees, volume - fees)
                - placeholder: ____3
                  accepted:
                    - compareByDescending<MerchantFeeReport> { it.netCents }.thenBy { it.merchant }
                  options:
