  - id: ch10-rate-limiter
    title: Rate limiter
    explanation: |
      Rate limits are mostly about boundaries and state. A fixed window groups timestamps by bucket; a sliding window keeps only allowed timestamps inside the half-open interval and never counts denied requests.
    exercises:
      - type: multi_part_problem
        id: ch10-rate-limiter-problem
        prompt: Build a per-merchant rate limiter, then consider how its state scales.
        story: |
          Requests arrive in time order as `(timestamp in seconds, merchant id)`. Return allow or deny for each one. The examples use N = 2 and W = 10 unless a part says otherwise.
        parts:
          - id: ch10-rate-limiter-part-1
            prompt: "Fixed window: each merchant gets at most N requests per window `[k·W, (k+1)·W)`. N = 2, W = 10."
            starter_code: |
              data class Request(val timestamp: Int, val merchant: String)

              fun fixedWindow(requests: List<Request>, limit: Int, window: Int): List<Boolean> = TODO()
            hidden_tests: |
              import org.junit.Assert.assertEquals
              import org.junit.Test

              class RateLimiterPart1Test {
                  @Test fun example() {
                      val requests = listOf(Request(1, "a"), Request(2, "a"), Request(3, "a"), Request(11, "a"), Request(12, "b"))
                      assertEquals(listOf(true, true, false, true, true), fixedWindow(requests, 2, 10))
                  }
              }
            reference_solution: |
              data class Request(val timestamp: Int, val merchant: String)

              fun fixedWindow(requests: List<Request>, limit: Int, window: Int): List<Boolean> {
                  val counts = mutableMapOf<Pair<String, Int>, Int>()
                  return requests.map { request ->
                      val bucket = request.timestamp / window
                      val key = request.merchant to bucket
                      val count = counts[key] ?: 0
                      if (count < limit) {
                          counts[key] = count + 1
                          true
                      } else false
                  }
              }
