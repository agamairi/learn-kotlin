id: ch10-stripe-classics
title: Stripe classics
summary: Practice Stripe-flavoured Kotlin problems involving money, ledgers, matching, cards, balancing and rate limits.
lessons:
  - id: ch10-card-fee-report
    title: Card fee report
    explanation: |
      Work with CSV text and integer cents. The important details are to validate each row, round the percentage part half-up for each transaction, and keep the fixed fee separate from the percentage fee when refunds are introduced.
    exercises:
      - type: multi_part_problem
        id: ch10-card-fee-report-problem
        prompt: Build the fee report in four steps, keeping money in whole cents.
        story: |
          Stripe takes a fee on every card payment. You get a day's transactions as CSV text, with amounts in integer cents. The examples below use the same rows as the interview exercise.
        parts:
          - id: ch10-card-fee-report-part-1
            prompt: |
              The input is:

                  id,merchant,amount_cents,card
                  tx1,acme,1000,visa
                  tx2,acme,2550,amex
                  tx3,bolt,99,visa

              The fee is 2.9% of the amount, rounded half-up to a whole cent, plus 30¢. Return each transaction's fee.
            starter_code: |
              data class TransactionFee(val id: String, val feeCents: Long)

              fun transactionFees(csv: String): List<TransactionFee> = TODO()
            hidden_tests: |
              import org.junit.Assert.assertEquals
              import org.junit.Test

              class CardFeeReportPart1Test {
                  @Test fun examples() {
                      val csv = """id,merchant,amount_cents,card
              tx1,acme,1000,visa
              tx2,acme,2550,amex
              tx3,bolt,99,visa"""
                      assertEquals(
                          listOf(TransactionFee("tx1", 59), TransactionFee("tx2", 104), TransactionFee("tx3", 33)),
                          transactionFees(csv)
                      )
                  }
              }
            reference_solution: |
              data class TransactionFee(val id: String, val feeCents: Long)

              private fun percentageFee(amount: Long, basisPoints: Long): Long = (amount * basisPoints + 5_000) / 10_000

              fun transactionFees(csv: String): List<TransactionFee> = csv.lineSequence()
                  .drop(1)
                  .filter { it.isNotBlank() }
                  .map { line ->
                      val fields = line.split(',')
                      TransactionFee(fields[0], percentageFee(fields[2].toLong(), 290) + 30)
                  }
                  .toList()
