              data class Request(val timestamp: Int, val merchant: String)

              fun fixedWindow(requests: List<Request>, limit: Int, window: Int): List<Boolean> {
                  val counts = mutableMapOf<Pair<String, Int>, Int>()
                  return requests.map { request ->
                      val key = request.merchant to (request.timestamp / window)
                      val count = counts[key] ?: 0
                      if (count < limit) { counts[key] = count + 1; true } else false
                  }
              }

