                    - compareBy<MerchantFeeReport> { it.netCents }.thenBy { it.merchant }
                    - compareByDescending<MerchantFeeReport> { it.volumeCents }.thenBy { it.merchant }
                    - compareByDescending<MerchantFeeReport> { it.netCents }.thenByDescending { it.merchant }
