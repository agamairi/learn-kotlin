                  var failures = 0
                  val delivered = mutableListOf<String>()
                  for (attempt in attempts) {
                      if (attempt.success) {
                          failures = 0
                          delivered += attempt.eventId
                      } else {
                          failures++
                          if (failures == 5) return EndpointReport(attempt.minute, delivered.distinct())
                      }
                  }
                  return EndpointReport(null, delivered.distinct())
              }
