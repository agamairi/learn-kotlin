        source_note: Original exercise; retry guidance is inspired by Stripe documentation.

  - id: ch11-more-practice-currency-conversion
    title: Currency conversion
    explanation: |
      Exchange rates arrive as decimal text, so construct `BigDecimal` values from
      strings. Keep the full-precision result while following a path and round only
      the final amount to two decimal places with `RoundingMode.HALF_UP`.
    exercises:
      - type: multi_part_problem
        id: ch11-more-practice-currency-conversion-problem
        prompt: |
          Rates arrive as text: `USD:CAD:1.37,USD:EUR:0.92,EUR:GBP:0.86,CAD:JPY:110`.
          A rate also works backwards. Round the final amount half-up to 2 decimals.
          Amounts are decimal strings; compare formatted results as strings such as
          `"19047.02"`.
        story: |
          Use `BigDecimal` built from rate strings, never `Double`. Reverse rates
          require division with an explicit scale and rounding mode.
        parts:
          - id: ch11-more-practice-currency-conversion-part-1
            prompt: Support direct conversion only.
            starter_code: |
              fun convertDirect(ratesText: String, amount: String, from: String, to: String): String = TODO()
            hidden_tests: |
              import org.junit.Assert.assertEquals
              import org.junit.Test

              class CurrencyConversionPart1Test {
                  private val rates = "USD:CAD:1.37,USD:EUR:0.92,EUR:GBP:0.86,CAD:JPY:110"

                  @Test fun convertsForwardAndBackward() {
                      assertEquals("137.00", convertDirect(rates, "100", "USD", "CAD"))
                      assertEquals("100.00", convertDirect(rates, "137", "CAD", "USD"))
                      assertEquals("10.87", convertDirect(rates, "10", "EUR", "USD"))
                  }

                  @Test fun sameCurrencyIsUnchanged() {
                      assertEquals("12.30", convertDirect(rates, "12.3", "USD", "USD"))
                  }
              }
            reference_solution: |
              import java.math.BigDecimal
              import java.math.RoundingMode

              private data class FxEdge(val to: String, val rate: BigDecimal)

              private fun graph(ratesText: String): Map<String, List<FxEdge>> {
                  val result = mutableMapOf<String, MutableList<FxEdge>>()
                  for (raw in ratesText.split(",").filter { it.isNotBlank() }) {
                      val fields = raw.trim().split(":")
                      require(fields.size == 3)
                      val from = fields[0].trim(); val to = fields[1].trim(); val rate = BigDecimal(fields[2].trim())
                      result.getOrPut(from) { mutableListOf() } += FxEdge(to, rate)
                      result.getOrPut(to) { mutableListOf() } += FxEdge(from, BigDecimal.ONE.divide(rate, 24, RoundingMode.HALF_UP))
                  }
                  return result
              }

              private fun money(value: BigDecimal): String = value.setScale(2, RoundingMode.HALF_UP).toPlainString()

              fun convertDirect(ratesText: String, amount: String, from: String, to: String): String {
                  val graph = graph(ratesText)
                  if (from == to) {
                      require(graph.containsKey(from))
                      return money(BigDecimal(amount))
                  }
                  val edge = graph[from].orEmpty().firstOrNull { it.to == to } ?: throw IllegalArgumentException("unknown or non-direct currency")
                  return money(BigDecimal(amount).multiply(edge.rate))
              }
            expected: |
              `100 USD → CAD = 137.00` · `137 CAD → USD = 100.00` · `10 EUR → USD = 10.87`.
          - id: ch11-more-practice-currency-conversion-part-2
            prompt: Allow at most one intermediate currency.
            starter_code: |
              fun convertWithOneIntermediate(ratesText: String, amount: String, from: String, to: String): String = TODO()
            hidden_tests: |
              import org.junit.Assert.assertEquals
              import org.junit.Test

              class CurrencyConversionPart2Test {
                  private val rates = "USD:CAD:1.37,USD:EUR:0.92,EUR:GBP:0.86,CAD:JPY:110"

                  @Test fun usesOneIntermediateCurrency() {
                      assertEquals("79.12", convertWithOneIntermediate(rates, "100", "USD", "GBP"))
                      assertEquals("150.70", convertWithOneIntermediate(rates, "1", "USD", "JPY"))
                  }
              }
            reference_solution: |
              import java.math.BigDecimal
              import java.math.RoundingMode

              private data class FxEdge(val to: String, val rate: BigDecimal)

              private fun graph(ratesText: String): Map<String, List<FxEdge>> {
                  val result = mutableMapOf<String, MutableList<FxEdge>>()
                  for (raw in ratesText.split(",").filter { it.isNotBlank() }) {
                      val fields = raw.trim().split(":")
                      require(fields.size == 3)
                      val from = fields[0].trim(); val to = fields[1].trim(); val rate = BigDecimal(fields[2].trim())
                      result.getOrPut(from) { mutableListOf() } += FxEdge(to, rate)
                      result.getOrPut(to) { mutableListOf() } += FxEdge(from, BigDecimal.ONE.divide(rate, 24, RoundingMode.HALF_UP))
                  }
                  return result
              }

              private fun money(value: BigDecimal): String = value.setScale(2, RoundingMode.HALF_UP).toPlainString()

              private fun findPath(graph: Map<String, List<FxEdge>>, from: String, to: String, maxEdges: Int): List<FxEdge>? {
                  if (from == to) return emptyList()
                  fun visit(current: String, path: List<FxEdge>, seen: Set<String>): List<FxEdge>? {
                      if (current == to) return path
                      if (path.size == maxEdges) return null
                      return graph[current].orEmpty().firstNotNullOfOrNull { edge ->
                          if (edge.to in seen) null else visit(edge.to, path + edge, seen + edge.to)
                      }
                  }
                  require(graph.containsKey(from) && graph.containsKey(to))
                  return visit(from, emptyList(), setOf(from))
              }

              private fun convertPath(amount: String, path: List<FxEdge>): String {
                  var value = BigDecimal(amount)
                  path.forEach { value = value.multiply(it.rate) }
                  return money(value)
              }

              fun convertWithOneIntermediate(ratesText: String, amount: String, from: String, to: String): String {
                  val path = findPath(graph(ratesText), from, to, 2) ?: throw IllegalArgumentException("no path")
                  return convertPath(amount, path)
              }
            expected: |
              `100 USD → GBP = 79.12 (via EUR)` · `1 USD → JPY = 150.70 (via CAD)`.
          - id: ch11-more-practice-currency-conversion-part-3
            prompt: Allow any number of steps, without rounding between steps.
            starter_code: |
              data class FxQuote(val amount: String, val path: List<String>)

              fun convertAnyPath(ratesText: String, amount: String, from: String, to: String): FxQuote = TODO()
            hidden_tests: |
              import org.junit.Assert.assertEquals
              import org.junit.Test

              class CurrencyConversionPart3Test {
                  @Test fun keepsPrecisionAcrossTheWholePath() {
                      val rates = "USD:CAD:1.37,USD:EUR:0.92,EUR:GBP:0.86,CAD:JPY:110"
                      assertEquals(FxQuote("19047.02", listOf("GBP", "EUR", "USD", "CAD", "JPY")), convertAnyPath(rates, "100", "GBP", "JPY"))
                  }
              }
            reference_solution: |
              import java.math.BigDecimal
              import java.math.RoundingMode

              data class FxQuote(val amount: String, val path: List<String>)
              private data class FxEdge(val to: String, val rate: BigDecimal)

              private fun graph(ratesText: String): Map<String, List<FxEdge>> {
                  val result = mutableMapOf<String, MutableList<FxEdge>>()
                  for (raw in ratesText.split(",").filter { it.isNotBlank() }) {
                      val fields = raw.trim().split(":")
                      require(fields.size == 3)
                      val from = fields[0].trim(); val to = fields[1].trim(); val rate = BigDecimal(fields[2].trim())
                      result.getOrPut(from) { mutableListOf() } += FxEdge(to, rate)
                      result.getOrPut(to) { mutableListOf() } += FxEdge(from, BigDecimal.ONE.divide(rate, 24, RoundingMode.HALF_UP))
                  }
                  return result
              }

              private fun money(value: BigDecimal): String = value.setScale(2, RoundingMode.HALF_UP).toPlainString()

              fun convertAnyPath(ratesText: String, amount: String, from: String, to: String): FxQuote {
                  val graph = graph(ratesText)
                  require(graph.containsKey(from) && graph.containsKey(to))
                  fun visit(current: String, value: BigDecimal, path: List<String>, seen: Set<String>): FxQuote? {
                      if (current == to) return FxQuote(money(value), path)
                      return graph[current].orEmpty().firstNotNullOfOrNull { edge ->
                          if (edge.to in seen) null else visit(edge.to, value.multiply(edge.rate), path + edge.to, seen + edge.to)
                      }
                  }
                  return visit(from, BigDecimal(amount), listOf(from), setOf(from)) ?: throw IllegalArgumentException("no path")
              }
            expected: |
              `100 GBP → JPY = 19047.02 (GBP → EUR → USD → CAD → JPY)`.
          - id: ch11-more-practice-currency-conversion-part-4
            prompt: Add `USD:GBP:0.80`. Two paths now disagree. Return the path that gives the customer the most money, show both, and explain why rates must never be stored as floating point.
            starter_code: |
              data class FxComparison(val best: FxQuote, val options: List<FxQuote>)

              fun compareConversions(ratesText: String, amount: String, from: String, to: String): FxComparison = TODO()
            hidden_tests: |
              import org.junit.Assert.assertEquals
              import org.junit.Test

              class CurrencyConversionPart4Test {
                  @Test fun choosesTheMoreGenerousPathAndShowsBoth() {
                      val rates = "USD:CAD:1.37,USD:EUR:0.92,EUR:GBP:0.86,CAD:JPY:110,USD:GBP:0.80"
                      val result = compareConversions(rates, "100", "USD", "GBP")
                      assertEquals(FxQuote("80.00", listOf("USD", "GBP")), result.best)
                      assertEquals(setOf("80.00", "79.12"), result.options.map { it.amount }.toSet())
                  }
              }
            reference_solution: |
              import java.math.BigDecimal
              import java.math.RoundingMode

              data class FxQuote(val amount: String, val path: List<String>)
              data class FxComparison(val best: FxQuote, val options: List<FxQuote>)
              private data class FxEdge(val to: String, val rate: BigDecimal)

              private fun graph(ratesText: String): Map<String, List<FxEdge>> {
                  val result = mutableMapOf<String, MutableList<FxEdge>>()
                  for (raw in ratesText.split(",").filter { it.isNotBlank() }) {
                      val fields = raw.trim().split(":")
                      require(fields.size == 3)
                      val from = fields[0].trim(); val to = fields[1].trim(); val rate = BigDecimal(fields[2].trim())
                      result.getOrPut(from) { mutableListOf() } += FxEdge(to, rate)
                      result.getOrPut(to) { mutableListOf() } += FxEdge(from, BigDecimal.ONE.divide(rate, 24, RoundingMode.HALF_UP))
                  }
                  return result
              }

              private fun money(value: BigDecimal): String = value.setScale(2, RoundingMode.HALF_UP).toPlainString()

              fun compareConversions(ratesText: String, amount: String, from: String, to: String): FxComparison {
                  val graph = graph(ratesText)
                  require(graph.containsKey(from) && graph.containsKey(to))
                  fun visit(current: String, value: BigDecimal, path: List<String>, seen: Set<String>): List<FxQuote> {
                      if (current == to) return listOf(FxQuote(money(value), path))
                      return graph[current].orEmpty().flatMap { edge ->
                          if (edge.to in seen) emptyList() else visit(edge.to, value.multiply(edge.rate), path + edge.to, seen + edge.to)
                      }
                  }
                  val options = visit(from, BigDecimal(amount), listOf(from), setOf(from))
                      .distinctBy { it.path }
                      .sortedByDescending { BigDecimal(it.amount) }
                  require(options.isNotEmpty())
                  return FxComparison(options.first(), options)
              }
            expected: |
              `100 USD → GBP = 80.00 direct, vs 79.12 via EUR`; choose the direct path.
              Store rates as decimal strings because binary floating point cannot represent
              most decimal fractions exactly and can change a rounded money result.
        faq:
          - question: Round at each step?
            answer: No, only at the end.
          - question: Same currency?
            answer: The amount is unchanged.
          - question: Unknown currency?
            answer: An error.
          - question: JPY decimals?
            answer: Keep 2 here. Say how real minor units differ (JPY has none).
        source_note: Original exercise; amount handling follows the course's BigDecimal guidance.

  - id: ch11-more-practice-checkout-discounts
    title: Checkout discounts
    explanation: |
      Keep prices in cents as `Long`. Parse the cart, compute the subtotal, then
      apply coupon kinds in the required order. For percentage discounts and tax,
      use exact decimal arithmetic and round half-up once for each operation.
    exercises:
      - type: multi_part_problem
        id: ch11-more-practice-checkout-discounts-problem
        prompt: |
          A point-of-sale cart has lines `sku,unit_price_cents,qty`, separated by
          semicolons: `tee,2000,2; mug,1250,1; sticker,300,4`.
          Prices are cents and tax is Ontario HST.
        story: |
          Build the checkout in stages. The cart's subtotal is 6450 cents, so the
          examples make rounding and coupon order visible.
        parts:
          - id: ch11-more-practice-checkout-discounts-part-1
            prompt: |
              Compute the subtotal, then apply one `SAVE10` coupon: 10% off the subtotal, rounded half-up to a cent.
            starter_code: |
              data class CartLine(val sku: String, val unitPriceCents: Long, val quantity: Int)

              fun parseCart(text: String): List<CartLine> = TODO()

              fun subtotal(lines: List<CartLine>): Long = TODO()

              fun save10(lines: List<CartLine>): Long = TODO()
            hidden_tests: |
              import org.junit.Assert.assertEquals
              import org.junit.Test

              class CheckoutDiscountsPart1Test {
                  private val cart = "tee,2000,2; mug,1250,1; sticker,300,4"

                  @Test fun computesSubtotalAndSave10() {
                      val lines = parseCart(cart)
                      assertEquals(6450L, subtotal(lines))
                      assertEquals(5805L, save10(lines))
                  }

                  @Test fun roundsHalfUp() {
                      assertEquals(4L, save10(parseCart("pin,5,1")))
                  }
              }
            reference_solution: |
              import java.math.BigDecimal
              import java.math.RoundingMode

              data class CartLine(val sku: String, val unitPriceCents: Long, val quantity: Int)

              fun parseCart(text: String): List<CartLine> = text.split(";").filter { it.isNotBlank() }.map { raw ->
                  val fields = raw.trim().split(",").map(String::trim)
                  require(fields.size == 3)
                  CartLine(fields[0], fields[1].toLong(), fields[2].toInt())
              }

              fun subtotal(lines: List<CartLine>): Long = lines.sumOf { it.unitPriceCents * it.quantity }

              private fun percentDiscount(base: Long, percent: String): Long =
                  BigDecimal.valueOf(base).multiply(BigDecimal(percent)).setScale(0, RoundingMode.HALF_UP).toLong()

              fun save10(lines: List<CartLine>): Long = subtotal(lines) - percentDiscount(subtotal(lines), "0.10")
            expected: |
              `subtotal 6450 · discount 645 · total 5805`.
          - id: ch11-more-practice-checkout-discounts-part-2
            prompt: |
              Support `SAVE10` (10% off the subtotal), `FIVEOFF` (500 off), and
              `TEES20` (20% off tee lines only). Apply one code. A total never goes
              below 0, and an unknown code is an error.
            starter_code: |
              fun applyCoupon(lines: List<CartLine>, code: String): Long = TODO()
            hidden_tests: |
              import org.junit.Assert.assertEquals
              import org.junit.Test

              class CheckoutDiscountsPart2Test {
                  private val lines = parseCart("tee,2000,2; mug,1250,1; sticker,300,4")

                  @Test fun supportsEachCouponKind() {
                      assertEquals(5650L, applyCoupon(lines, "TEES20"))
                      assertEquals(5950L, applyCoupon(lines, "FIVEOFF"))
                      assertEquals(5805L, applyCoupon(lines, "SAVE10"))
                  }
              }
            reference_solution: |
              import java.math.BigDecimal
              import java.math.RoundingMode

              data class CartLine(val sku: String, val unitPriceCents: Long, val quantity: Int)

              fun parseCart(text: String): List<CartLine> = text.split(";").filter { it.isNotBlank() }.map { raw ->
                  val fields = raw.trim().split(",").map(String::trim)
                  require(fields.size == 3)
                  CartLine(fields[0], fields[1].toLong(), fields[2].toInt())
              }

              fun subtotal(lines: List<CartLine>): Long = lines.sumOf { it.unitPriceCents * it.quantity }

              private fun percentDiscount(base: Long, percent: String): Long =
                  BigDecimal.valueOf(base).multiply(BigDecimal(percent)).setScale(0, RoundingMode.HALF_UP).toLong()

              fun save10(lines: List<CartLine>): Long = subtotal(lines) - percentDiscount(subtotal(lines), "0.10")

              fun applyCoupon(lines: List<CartLine>, code: String): Long = when (code.trim()) {
                  "SAVE10" -> (subtotal(lines) - percentDiscount(subtotal(lines), "0.10")).coerceAtLeast(0)
                  "FIVEOFF" -> (subtotal(lines) - 500L).coerceAtLeast(0)
                  "TEES20" -> {
                      val teeTotal = lines.filter { it.sku == "tee" }.sumOf { it.unitPriceCents * it.quantity }
                      (subtotal(lines) - percentDiscount(teeTotal, "0.20")).coerceAtLeast(0)
                  }
                  else -> throw IllegalArgumentException("unknown coupon")
              }
            expected: |
              `TEES20 → 5650` · `FIVEOFF → 5950`.
