              }
            reference_solution: |
              fun explainWebhookReliability(): String =
                  "Add jitter to spread retries and avoid a thundering herd. A merchant may receive the same event twice, so it should deduplicate by event id and handle the operation idempotently; the sender should retry safely."
            expected: |
              Add random jitter so many customers do not retry at exactly the same time.
              Delivery is at-least-once, so a merchant may see an event twice: deduplicate
              by event id and make its handler idempotent, while the sender retries safely.
        faq:
