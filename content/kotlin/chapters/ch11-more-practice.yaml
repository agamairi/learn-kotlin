              fun subtotal(lines: List<CartLine>): Long = lines.sumOf { it.unitPriceCents * it.quantity }

              private fun percentDiscount(base: Long, percent: String): Long =
                  BigDecimal.valueOf(base).multiply(BigDecimal(percent)).setScale(0, RoundingMode.HALF_UP).toLong()

              fun save10(lines: List<CartLine>): Long = subtotal(lines) - percentDiscount(subtotal(lines), "0.10")

              fun applyCoupon(lines: List<CartLine>, code: String): Long = when (code.trim()) {
                  "SAVE10" -> (subtotal(lines) - percentDiscount(subtotal(lines), "0.10")).coerceAtLeast(0)
                  "FIVEOFF" -> (subtotal(lines) - 500L).coerceAtLeast(0)
                  "TEES20" -> {
                      val teeTotal = lines.filter { it.sku == "tee" }.sumOf { it.unitPriceCents * it.quantity }
                      (subtotal(lines) - percentDiscount(teeTotal, "0.20")).coerceAtLeast(0)
                  }
                  else -> throw IllegalArgumentException("unknown coupon")
              }

              fun checkoutTotal(lines: List<CartLine>, codes: List<String>): Long {
                  val normalized = codes.map(String::trim)
                  val kinds = normalized.map { code -> when (code) {
                      "TEES20" -> "item"
                      "SAVE10" -> "percentage"
                      "FIVEOFF" -> "fixed"
                      else -> throw IllegalArgumentException("unknown coupon")
                  } }
                  require(kinds.groupingBy { it }.eachCount().values.all { it == 1 })
                  var total = subtotal(lines)
                  if ("TEES20" in normalized) total = applyCoupon(lines, "TEES20")
                  if ("SAVE10" in normalized) total = (total - percentDiscount(total, "0.10")).coerceAtLeast(0)
                  if ("FIVEOFF" in normalized) total = (total - 500L).coerceAtLeast(0)
                  return total
              }

              fun checkoutWithTax(lines: List<CartLine>, codes: List<String>): CheckoutTotal {
                  val discounted = checkoutTotal(lines, codes)
                  val tax = BigDecimal.valueOf(discounted).multiply(BigDecimal("0.13")).setScale(0, RoundingMode.HALF_UP).toLong()
                  return CheckoutTotal(discounted, tax, discounted + tax)
              }
            expected: |
              `tax 596 · grand total 5181`. If every line needs its own tax line,
              calculate and round each line's tax separately, then sum those rounded taxes;
              that can differ from rounding tax on the aggregate discounted total.
        faq:
          - question: Two coupons of the same kind?
            answer: An error.
          - question: When to round?
            answer: Half-up, once per discount.
          - question: Whitespace?
            answer: Trim around separators.
