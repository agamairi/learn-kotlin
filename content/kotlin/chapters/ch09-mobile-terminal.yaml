              fun compareVersions(left: String, right: String): Int { val a = requireNotNull(parseVersion(left)); val b = requireNotNull(parseVersion(right)); return compareValuesBy(a, b, { it.major }, { it.minor }, { it.patch }) }
              fun gateVersion(version: String, minimum: String): FeatureResult { val a = parseVersion(version) ?: return FeatureResult.InvalidVersion; val b = parseVersion(minimum) ?: return FeatureResult.InvalidVersion; return if (compareValuesBy(a, b, { it.major }, { it.minor }, { it.patch }) >= 0) FeatureResult.Enabled else FeatureResult.TooOld }
              fun rolloutVersion(version: String, minimum: String, installId: String, percentage: Int): FeatureResult { val gate = gateVersion(version, minimum); if (gate != FeatureResult.Enabled) return gate; return if (installId.sumOf { it.code } % 100 < percentage) FeatureResult.Enabled else FeatureResult.DisabledByRollout }
            hints:
              - Gate the version before calculating the bucket.
              - "`abc` has bucket 94, and the comparison is strictly less than the percentage."
            expected: |
              Install `"abc"` (bucket 94) on 3.1.4: `percentage 94 → DisabledByRollout · 95 → Enabled`. Install `"reader-42"` has bucket 74.

        faq:
          - question: Is `1.2` valid?
            answer: No. It needs three parts.
          - question: Leading zeros like `"01"`?
            answer: Allowed. Parse them as numbers.
          - question: Is the percentage inclusive?
            answer: "No: bucket < percentage."
          - question: Do too-old installs join the rollout?
            answer: No.
        discussion: |
          Decide version and configuration policies before shipping a gradual feature gate. Pre-release versions need an explicit comparison policy; do not silently strip suffixes. Version the rollout hash algorithm because changing it reshuffles users. Add a remotely controlled kill switch that overrides rollout, validate and cache remote configuration, preserve a last-known-good value, and choose a safe default for bad config.
        source_note: Stripe's published sample, paraphrased

  - id: kotlin-ch09-deep-link-router
    title: Deep-link router
    explanation: |
      Parse deep links into typed routes. Keep parsing and validation deterministic: detect duplicate parameters before putting them in a map, ignore unknown parameters, and return `Invalid` instead of throwing.
    exercises:
      - type: multi_part_problem
        id: kotlin-ch09-ex-deep-link-router
        prompt: Parse payment and refund links into typed routes without scattering string checks through UI code.
        story: |
          A companion app receives links that open a payment or start a refund. Parse them into typed routes.
        parts:
          - id: kotlin-ch09-deeplink-part-1
            prompt: Parse `terminal://payments/{paymentId}` as `PaymentDetails(paymentId)`. Anything else is `Unknown`.
            starter_code: |
              sealed interface Route {
                  data class PaymentDetails(val paymentId: String) : Route
                  data class Refund(val paymentId: String, val amountCents: Long) : Route
                  data class Invalid(val reason: String) : Route
                  data object Unknown : Route
              }
              fun parseRoute(link: String): Route = TODO()
            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class DeepLinkRouterPart1Test {
                  @Test fun parsesPaymentDetails() {
                      assertEquals(Route.PaymentDetails("pay_123"), parseRoute("terminal://payments/pay_123"))
                  }
                  @Test fun unknownLinksAreUnknown() {
                      assertEquals(Route.Unknown, parseRoute("terminal://settings"))
                      assertEquals(Route.Unknown, parseRoute("stripe://payments/pay_123"))
                  }
              }
            reference_solution: |
              sealed interface Route {
                  data class PaymentDetails(val paymentId: String) : Route
                  data class Refund(val paymentId: String, val amountCents: Long) : Route
                  data class Invalid(val reason: String) : Route
                  data object Unknown : Route
              }
              fun parseRoute(link: String): Route {
                  val prefix = "terminal://payments/"
                  return if (link.startsWith(prefix) && link.removePrefix(prefix).isNotEmpty() && !link.removePrefix(prefix).contains('?')) Route.PaymentDetails(link.removePrefix(prefix)) else Route.Unknown
              }
            hints:
              - Match the exact scheme and path prefix.
              - Require a non-empty id and reject extra query text for this route.
            expected: |
              `"terminal://payments/pay_123" → PaymentDetails("pay_123") · "terminal://settings" → Unknown`.

          - id: kotlin-ch09-deeplink-part-2
            prompt: Parse `terminal://refund` query parameters `paymentId` and `amount` (a positive integer in cents). Their order does not matter.
            starter_code: |
              sealed interface Route {
                  data class PaymentDetails(val paymentId: String) : Route
                  data class Refund(val paymentId: String, val amountCents: Long) : Route
                  data class Invalid(val reason: String) : Route
                  data object Unknown : Route
              }
              fun parseRoute(link: String): Route = TODO()
            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class DeepLinkRouterPart2Test {
                  @Test fun refundParametersCanBeReordered() {
                      assertEquals(Route.Refund("pay_123", 500), parseRoute("terminal://refund?amount=500&paymentId=pay_123"))
                      assertEquals(Route.Refund("pay_123", 500), parseRoute("terminal://refund?paymentId=pay_123&amount=500"))
                  }
                  @Test fun zeroIsNotAValidAmount() {
                      assertEquals(Route.Invalid("amount must be positive"), parseRoute("terminal://refund?paymentId=p1&amount=0"))
                  }
              }
            reference_solution: |
              sealed interface Route { data class PaymentDetails(val paymentId: String) : Route; data class Refund(val paymentId: String, val amountCents: Long) : Route; data class Invalid(val reason: String) : Route; data object Unknown : Route }
              fun parseRoute(link: String): Route {
                  if (link.startsWith("terminal://payments/")) { val id = link.removePrefix("terminal://payments/"); return if (id.isNotEmpty() && !id.contains('?')) Route.PaymentDetails(id) else Route.Unknown }
                  if (!link.startsWith("terminal://refund?")) return Route.Unknown
                  val values = link.substringAfter('?').split('&').mapNotNull { pair -> pair.split('=', limit = 2).takeIf { it.size == 2 }?.let { it[0] to it[1] } }.toMap()
                  val id = values["paymentId"] ?: return Route.Invalid("missing paymentId")
                  val amount = values["amount"]?.toLongOrNull() ?: return Route.Invalid("amount is not a number")
                  return if (amount > 0) Route.Refund(id, amount) else Route.Invalid("amount must be positive")
              }
            hints:
              - Split off the query and read both known keys by name.
              - Convert the amount with `toLongOrNull()` and require it to be greater than zero.
            expected: |
              `"terminal://refund?amount=500&paymentId=pay_123" → Refund("pay_123", 500)`.

          - id: kotlin-ch09-deeplink-part-3
            prompt: Return `Invalid(reason)` instead of throwing for duplicate, missing, non-numeric, or non-positive values. Ignore unknown parameters.
            starter_code: |
              sealed interface Route {
                  data class PaymentDetails(val paymentId: String) : Route
                  data class Refund(val paymentId: String, val amountCents: Long) : Route
                  data class Invalid(val reason: String) : Route
                  data object Unknown : Route
              }
              fun parseRoute(link: String): Route = TODO()
            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class DeepLinkRouterPart3Test {
                  @Test fun reportsDeterministicValidationReasons() {
                      assertEquals(Route.Invalid("duplicate amount"), parseRoute("terminal://refund?paymentId=p1&amount=5&amount=6"))
                      assertEquals(Route.Invalid("missing paymentId"), parseRoute("terminal://refund?amount=500"))
                      assertEquals(Route.Invalid("amount must be positive"), parseRoute("terminal://refund?paymentId=p1&amount=0"))
                      assertEquals(Route.Invalid("amount is not a number"), parseRoute("terminal://refund?paymentId=p1&amount=abc&source=email"))
                  }
                  @Test fun unknownParametersAreIgnored() {
                      assertEquals(Route.Refund("p1", 5), parseRoute("terminal://refund?source=email&amount=5&paymentId=p1"))
                  }
              }
            reference_solution: |
              sealed interface Route { data class PaymentDetails(val paymentId: String) : Route; data class Refund(val paymentId: String, val amountCents: Long) : Route; data class Invalid(val reason: String) : Route; data object Unknown : Route }
              fun parseRoute(link: String): Route {
                  if (link.startsWith("terminal://payments/")) { val id = link.removePrefix("terminal://payments/"); return if (id.isNotEmpty() && !id.contains('?')) Route.PaymentDetails(id) else Route.Unknown }
                  if (!link.startsWith("terminal://refund?")) return Route.Unknown
                  val pairs = link.substringAfter('?').split('&').mapNotNull { part -> part.split('=', limit = 2).takeIf { it.size == 2 }?.let { it[0] to it[1] } }
                  for (key in listOf("paymentId", "amount")) if (pairs.count { it.first == key } > 1) return Route.Invalid("duplicate $key")
                  val id = pairs.firstOrNull { it.first == "paymentId" }?.second ?: return Route.Invalid("missing paymentId")
                  val rawAmount = pairs.firstOrNull { it.first == "amount" }?.second ?: return Route.Invalid("missing amount")
                  val amount = rawAmount.toLongOrNull() ?: return Route.Invalid("amount is not a number")
                  return if (amount > 0) Route.Refund(id, amount) else Route.Invalid("amount must be positive")
              }
            hints:
              - Count known keys before converting the query pairs to a map.
              - Validate duplicates, required fields, numeric parsing, then positivity in that order.
            expected: |
              `"…refund?paymentId=p1&amount=5&amount=6" → Invalid("duplicate amount")` · `"…refund?amount=500" → Invalid("missing paymentId")` · `"…refund?paymentId=p1&amount=0" → Invalid("amount must be positive")` · `"…refund?paymentId=p1&amount=abc&source=email" → Invalid("amount is not a number")`.

        faq:
          - question: Case-sensitive?
            answer: Yes.
          - question: Can the amount be 0?
            answer: No. That's `Invalid`.
          - question: Unknown parameters?
            answer: Ignore them.
          - question: Throw or return?
            answer: Return a typed `Invalid`.
        discussion: |
          Keep parsing pure and validation deterministic; navigation and security policy belong around the parser. Decode percent-encoded values with a well-tested URL parser, reject overlong links, allowlist the exact scheme and host/path, avoid logging payment identifiers, and return typed data to a navigation layer rather than navigating from the parser.
        source_note: Stripe's published sample, paraphrased

  - id: kotlin-ch09-reader-states
    title: Reader states
    explanation: |
      A reader is a small state machine. Apply only valid transitions, record invalid events with the state that rejected them, and count successful payments and processing disconnects.
    exercises:
      - type: multi_part_problem
        id: kotlin-ch09-ex-reader-states
        prompt: Model the reader state machine and then extend it to invalid-event reporting, many readers, and reconciliation.
        story: |
          This is a plain Kotlin Terminal-flavoured state machine, not the real SDK. A reader starts `DISCONNECTED` and changes state as events arrive.

          ```text
          DISCONNECTED + connect        → CONNECTED
          CONNECTED    + collect        → COLLECTING
          COLLECTING   + card_presented → PROCESSING
          COLLECTING   + cancel         → CONNECTED
          PROCESSING   + succeeded      → CONNECTED
          PROCESSING   + failed         → COLLECTING
          any state except DISCONNECTED + disconnect → DISCONNECTED
          ```
        parts:
          - id: kotlin-ch09-reader-part-1
            prompt: Return the final state. Ignore invalid events.
            starter_code: |
              enum class ReaderState { DISCONNECTED, CONNECTED, COLLECTING, PROCESSING }
              data class InvalidReaderEvent(val index: Int, val event: String, val state: ReaderState)
              data class ReaderRun(val finalState: ReaderState, val invalidEvents: List<InvalidReaderEvent>, val successfulPayments: Int, val reconciliationCount: Int)
              data class ReaderSummary(val state: ReaderState, val successfulPayments: Int, val reconciliationCount: Int = 0)
              fun nextState(state: ReaderState, event: String): ReaderState? = TODO()
              fun runReader(events: List<String>): ReaderRun = TODO()
              fun runManyReaders(input: String): Map<String, ReaderSummary> = TODO()
            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class ReaderStatesPart1Test {
                  @Test fun successfulFlowEndsConnected() {
                      assertEquals(ReaderState.CONNECTED, runReader(listOf("connect", "collect", "card_presented", "succeeded")).finalState)
                  }
                  @Test fun invalidEventsAreIgnoredForState() {
                      assertEquals(ReaderState.CONNECTED, runReader(listOf("collect", "connect")).finalState)
                  }
              }
            reference_solution: |
              enum class ReaderState { DISCONNECTED, CONNECTED, COLLECTING, PROCESSING }
              data class InvalidReaderEvent(val index: Int, val event: String, val state: ReaderState)
              data class ReaderRun(val finalState: ReaderState, val invalidEvents: List<InvalidReaderEvent>, val successfulPayments: Int, val reconciliationCount: Int)
              data class ReaderSummary(val state: ReaderState, val successfulPayments: Int, val reconciliationCount: Int = 0)
              fun nextState(state: ReaderState, event: String): ReaderState? = when {
                  state == ReaderState.DISCONNECTED && event == "connect" -> ReaderState.CONNECTED
                  state == ReaderState.CONNECTED && event == "collect" -> ReaderState.COLLECTING
                  state == ReaderState.COLLECTING && event == "card_presented" -> ReaderState.PROCESSING
                  state == ReaderState.COLLECTING && event == "cancel" -> ReaderState.CONNECTED
                  state == ReaderState.PROCESSING && event == "succeeded" -> ReaderState.CONNECTED
                  state == ReaderState.PROCESSING && event == "failed" -> ReaderState.COLLECTING
                  state != ReaderState.DISCONNECTED && event == "disconnect" -> ReaderState.DISCONNECTED
                  else -> null
              }
              fun runReader(events: List<String>): ReaderRun {
                  var state = ReaderState.DISCONNECTED; val invalid = mutableListOf<InvalidReaderEvent>(); var successes = 0; var reconciliations = 0
                  events.forEachIndexed { index, event -> val old = state; val next = nextState(old, event); if (next == null) invalid += InvalidReaderEvent(index, event, old) else { if (old == ReaderState.PROCESSING && event == "succeeded") successes++; if (old == ReaderState.PROCESSING && event == "disconnect") reconciliations++; state = next } }
                  return ReaderRun(state, invalid, successes, reconciliations)
              }
              fun runManyReaders(input: String): Map<String, ReaderSummary> {
                  val states = linkedMapOf<String, ReaderState>(); val successes = mutableMapOf<String, Int>(); val reconciliations = mutableMapOf<String, Int>()
                  for (line in input.lines()) {
                      if (line.isBlank()) continue
                      val parts = line.trim().split(Regex("\\s+")); if (parts.size != 2) continue
                      val id = parts[0]; val event = parts[1]; val old = states[id] ?: ReaderState.DISCONNECTED; val next = nextState(old, event) ?: continue
                      if (old == ReaderState.PROCESSING && event == "succeeded") successes[id] = (successes[id] ?: 0) + 1
                      if (old == ReaderState.PROCESSING && event == "disconnect") reconciliations[id] = (reconciliations[id] ?: 0) + 1
                      states[id] = next
                  }
                  return states.mapValues { (id, state) -> ReaderSummary(state, successes[id] ?: 0, reconciliations[id] ?: 0) }
              }
            hints:
              - Encode the transition table as a `when` expression and return null for invalid events.
              - Fold the event list from `DISCONNECTED`, changing state only when `nextState` is non-null.
            expected: |
              `[connect, collect, card_presented, succeeded] → CONNECTED · [collect, connect] → CONNECTED`.

