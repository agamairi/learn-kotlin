            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class OfflineQueuePart2Test {
                  private class FakeSender(private vararg val results: SendResult) : PaymentSender {
                      private var index = 0
                      override fun send(payment: Payment, idempotencyKey: String): SendResult = results[index++]
                  }

                  @Test fun successRemovesHeadAndRetryKeepsIt() {
                      val queue = OfflineQueue(FakeSender(SendResult.SUCCESS, SendResult.RETRYABLE))
                      queue.enqueue("p1", 500); queue.enqueue("p2", 700)
                      assertEquals(ProcessResult.SENT, queue.processNext())
                      assertEquals(ProcessResult.WILL_RETRY, queue.processNext())
                      assertEquals(listOf(Payment("p2", 700)), queue.pending())
                      assertEquals(emptyList<Payment>(), queue.failed())
                  }

                  @Test fun permanentFailureMovesHeadToFailed() {
                      val queue = OfflineQueue(FakeSender(SendResult.PERMANENT))
                      queue.enqueue("p1", 100)
                      assertEquals(ProcessResult.MOVED_TO_FAILED, queue.processNext())
                      assertEquals(emptyList<Payment>(), queue.pending())
                      assertEquals(listOf(Payment("p1", 100)), queue.failed())
                  }
              }
