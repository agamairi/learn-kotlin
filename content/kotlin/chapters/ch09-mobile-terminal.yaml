                  }
                  @Test fun leadingZerosRemainValid() {
                      assertEquals(FeatureResult.Enabled, gateVersion("03.01.004", "3.1.4"))
                  }
              }
            reference_solution: |
              data class AppVersion(val major: Int, val minor: Int, val patch: Int)
              sealed interface FeatureResult {
