            reference_solution: |
              enum class AttemptOutcome { APPROVED, DECLINED, CONNECTIVITY, TIMEOUT, CANCELED_BY_READER }
              enum class CheckoutStatus { CAPTURED, FAILED_DECLINED, CANCELED, NEEDS_RECONCILIATION, AUTHORIZED_NOT_CAPTURED }
              data class CheckoutResult(val status: CheckoutStatus, val attempts: Int, val intentId: String, val paymentIntentsCreated: Int = 1)

              fun runCheckout(outcomes: List<AttemptOutcome>, intentId: String = "pi_1", captureSucceeds: Boolean = true, useLimits: Boolean = true): CheckoutResult {
                  var attempts = 0
                  for (outcome in outcomes) {
                      attempts++
                      when (outcome) {
                          AttemptOutcome.APPROVED -> return CheckoutResult(if (captureSucceeds) CheckoutStatus.CAPTURED else CheckoutStatus.AUTHORIZED_NOT_CAPTURED, attempts, intentId)
                          AttemptOutcome.CANCELED_BY_READER -> return CheckoutResult(CheckoutStatus.CANCELED, attempts, intentId)
                          AttemptOutcome.DECLINED, AttemptOutcome.CONNECTIVITY, AttemptOutcome.TIMEOUT -> Unit
                      }
                  }
                  return CheckoutResult(CheckoutStatus.NEEDS_RECONCILIATION, attempts, intentId)
              }

