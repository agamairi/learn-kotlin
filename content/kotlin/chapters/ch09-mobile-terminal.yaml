        faq:
          - question: Unknown event names?
            answer: Invalid.
          - question: Reader ids?
            answer: Any string without spaces.
          - question: Does disconnect while DISCONNECTED count as invalid?
            answer: Yes.
        discussion: |
          A processing disconnect leaves the payment outcome unknown. Persist the PaymentIntent id before processing and look up that same intent after reconnect; never create a replacement merely because the local call timed out.
