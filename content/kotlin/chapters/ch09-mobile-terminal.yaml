            prompt: Parse versions as `major.minor.patch` (three non-negative integers) and compare them.
            starter_code: |
              data class AppVersion(val major: Int, val minor: Int, val patch: Int)
              fun compareVersions(left: String, right: String): Int = TODO()
              fun gateVersion(version: String, minimum: String): FeatureResult = TODO()
              fun rolloutVersion(version: String, minimum: String, installId: String, percentage: Int): FeatureResult = TODO()

