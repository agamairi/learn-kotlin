        faq:
          - question: Can a later payment skip one that's retrying?
            answer: No. Keep the order.
          - question: Duplicate ids?
            answer: Return false and ignore them.
          - question: Thread safety?
            answer: Not needed.
          - question: How do I test without a network?
            answer: Pass in a fake sender that returns scripted answers (Lesson 8).
        discussion: |
          Discuss crash recovery, idempotency, durable queue storage, and practical size and retention limits. The persisted queue still contains a payment after a crash, so restart resends it; reusing the same idempotency key lets the server recognize the earlier logical operation instead of authorizing the card twice. Persist the queue and keys in transactional durable storage, with encryption, retention and count/byte limits, retry metadata, expiry rules, monitoring, and an operator path for permanent failures.
        source_note: Stripe's published sample, paraphrased

  - id: kotlin-ch09-telemetry-batcher
    title: Telemetry batcher
    explanation: |
      A reader SDK collects diagnostic events and uploads them when a batch is full or the oldest event is old enough. Inject time and uploading so tests never wait or use a network. Failed uploads retain events, and capacity drops the oldest event.
    exercises:
      - type: multi_part_problem
        id: kotlin-ch09-ex-telemetry-batcher
        prompt: Build an ordered telemetry batcher with size, age, upload, and storage-capacity rules.
        story: |
          A reader SDK collects diagnostic events and uploads them in batches without letting offline storage grow forever.
        parts:
          - id: kotlin-ch09-batcher-part-1
            prompt: A batch is ready when it holds N events. `add(event)` returns the batch to upload, or an empty list.
            starter_code: |
              data class StoredEvent(val value: String, val addedAt: Long)
              fun interface Clock { fun nowMillis(): Long }
              fun interface TelemetryUploader { fun upload(events: List<StoredEvent>): Boolean }

              class TelemetryBatcher(
                  private val batchSize: Int,
                  private val maxAgeMillis: Long = Long.MAX_VALUE,
                  private val capacity: Int = Int.MAX_VALUE,
                  private val clock: Clock = Clock { 0L }
              ) {
                  fun add(value: String): List<StoredEvent> = TODO()
                  fun check(): List<StoredEvent> = TODO()
                  fun upload(uploader: TelemetryUploader): List<StoredEvent> = TODO()
                  fun stored(): List<StoredEvent> = TODO()
                  fun dropped(): List<StoredEvent> = TODO()
                  fun setOnline(online: Boolean): Unit = TODO()
              }
            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class TelemetryBatcherPart1Test {
                  @Test fun returnsAFullBatchOnlyAtN() {
                      val batcher = TelemetryBatcher(3)
                      assertEquals(emptyList<StoredEvent>(), batcher.add("a"))
                      assertEquals(emptyList<StoredEvent>(), batcher.add("b"))
                      assertEquals(listOf(StoredEvent("a", 0), StoredEvent("b", 0), StoredEvent("c", 0)), batcher.add("c"))
                  }

                  @Test fun doesNotReturnBeforeTheConfiguredSize() {
                      val batcher = TelemetryBatcher(2)
                      assertEquals(emptyList<StoredEvent>(), batcher.add("a"))
                      assertEquals(listOf(StoredEvent("a", 0), StoredEvent("b", 0)), batcher.add("b"))
                  }
              }
            reference_solution: |
              data class StoredEvent(val value: String, val addedAt: Long)
              fun interface Clock { fun nowMillis(): Long }
              fun interface TelemetryUploader { fun upload(events: List<StoredEvent>): Boolean }

              class TelemetryBatcher(
                  private val batchSize: Int,
                  private val maxAgeMillis: Long = Long.MAX_VALUE,
                  private val capacity: Int = Int.MAX_VALUE,
                  private val clock: Clock = Clock { 0L }
              ) {
                  private val events = ArrayDeque<StoredEvent>()
                  private val droppedEvents = mutableListOf<StoredEvent>()
                  private var online = true

                  fun add(value: String): List<StoredEvent> {
                      events.addLast(StoredEvent(value, clock.nowMillis()))
                      while (events.size > capacity) droppedEvents += events.removeFirst()
                      return if (online && events.size >= batchSize) events.take(batchSize) else emptyList()
                  }

                  fun check(): List<StoredEvent> {
                      val first = events.firstOrNull() ?: return emptyList()
                      return if (online && clock.nowMillis() - first.addedAt >= maxAgeMillis) events.take(batchSize) else emptyList()
                  }

                  fun upload(uploader: TelemetryUploader): List<StoredEvent> {
                      if (!online || events.isEmpty()) return emptyList()
                      val batch = events.take(batchSize)
                      if (!uploader.upload(batch)) return emptyList()
                      repeat(batch.size) { events.removeFirst() }
                      return batch
                  }

                  fun stored(): List<StoredEvent> = events.toList()
                  fun dropped(): List<StoredEvent> = droppedEvents.toList()
                  fun setOnline(online: Boolean) { this.online = online }
