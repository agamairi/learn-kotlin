              import org.junit.Test
              import org.junit.Assert.assertEquals

              class CheckoutRetriesPart1Test {
                  @Test fun reusesOneIntentThroughDeclineAndTimeout() {
                      assertEquals(CheckoutResult(CheckoutStatus.CAPTURED, 3, "pi_1", 1), runCheckout(listOf(AttemptOutcome.DECLINED, AttemptOutcome.TIMEOUT, AttemptOutcome.APPROVED), useLimits = false))
                  }

                  @Test fun emptyOutcomesNeedReconciliation() {
                      assertEquals(CheckoutResult(CheckoutStatus.NEEDS_RECONCILIATION, 0, "pi_1", 1), runCheckout(emptyList(), useLimits = false))
                  }
