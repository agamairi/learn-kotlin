              }
            hints:
              - Save `addedAt` from the injected clock and inspect the oldest stored event.
              - Use `>= maxAgeMillis`, not just `>`.
            expected: |
              T = 1000, add a at 100: `check at 1099 → [] · check at 1100 → [a]`.

          - id: kotlin-ch09-batcher-part-3
            prompt: "Uploads can fail, and failed events stay stored in order. Storage holds at most 4 events: when over, drop the oldest. Batch size 3. While offline, add e1 to e5, then reconnect with uploads succeeding."
            starter_code: |
              data class StoredEvent(val value: String, val addedAt: Long)
              fun interface Clock { fun nowMillis(): Long }
              fun interface TelemetryUploader { fun upload(events: List<StoredEvent>): Boolean }

              class TelemetryBatcher(
                  private val batchSize: Int,
                  private val maxAgeMillis: Long = Long.MAX_VALUE,
                  private val capacity: Int = Int.MAX_VALUE,
                  private val clock: Clock = Clock { 0L }
              ) {
                  fun add(value: String): List<StoredEvent> = TODO()
                  fun check(): List<StoredEvent> = TODO()
                  fun upload(uploader: TelemetryUploader): List<StoredEvent> = TODO()
                  fun stored(): List<StoredEvent> = TODO()
                  fun dropped(): List<StoredEvent> = TODO()
                  fun setOnline(online: Boolean) = TODO()
              }
            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class TelemetryBatcherPart3Test {
                  private class FakeClock : Clock { override fun nowMillis() = 0L }
                  private class FakeUploader(private vararg val answers: Boolean) : TelemetryUploader {
                      private var index = 0
                      val sent = mutableListOf<List<StoredEvent>>()
                      override fun upload(events: List<StoredEvent>): Boolean {
                          val ok = answers.getOrElse(index++) { true }
                          if (ok) sent += events
                          return ok
                      }
                  }

                  @Test fun capacityDropsOldestAndReconnectSendsInBatches() {
                      val batcher = TelemetryBatcher(3, 1000, 4, FakeClock())
                      batcher.setOnline(false)
                      listOf("e1", "e2", "e3", "e4", "e5").forEach(batcher::add)
                      assertEquals(listOf(StoredEvent("e1", 0)), batcher.dropped())
                      val uploader = FakeUploader(true, true)
                      batcher.setOnline(true)
                      assertEquals(listOf(StoredEvent("e2", 0), StoredEvent("e3", 0), StoredEvent("e4", 0)), batcher.upload(uploader))
                      assertEquals(listOf(StoredEvent("e5", 0)), batcher.upload(uploader))
                      assertEquals(emptyList<StoredEvent>(), batcher.stored())
                      assertEquals(listOf(listOf(StoredEvent("e2", 0), StoredEvent("e3", 0), StoredEvent("e4", 0)), listOf(StoredEvent("e5", 0))), uploader.sent)
                  }

                  @Test fun failedUploadRetainsEvents() {
                      val batcher = TelemetryBatcher(2, 1000, 4, FakeClock())
                      batcher.add("a"); batcher.add("b")
                      assertEquals(emptyList<StoredEvent>(), batcher.upload(FakeUploader(false)))
                      assertEquals(listOf(StoredEvent("a", 0), StoredEvent("b", 0)), batcher.stored())
                  }
              }
            reference_solution: |
              data class StoredEvent(val value: String, val addedAt: Long)
              fun interface Clock { fun nowMillis(): Long }
              fun interface TelemetryUploader { fun upload(events: List<StoredEvent>): Boolean }

