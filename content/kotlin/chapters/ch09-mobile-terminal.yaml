                      if (amountCents <= 0 || id in knownIds) return false
                      knownIds += id; queue.addLast(Payment(id, amountCents)); return true
                  }
                  fun pending(): List<Payment> = queue.toList()
                  fun failed(): List<Payment> = failedPayments.toList()
                  fun processNext(): ProcessResult {
                      val payment = queue.firstOrNull() ?: return ProcessResult.EMPTY
                      return when (sender.send(payment, payment.id)) {
                          SendResult.SUCCESS -> { queue.removeFirst(); ProcessResult.SENT }
                          SendResult.RETRYABLE -> ProcessResult.WILL_RETRY
                          SendResult.PERMANENT -> {
                              queue.removeFirst(); failedPayments += payment; ProcessResult.MOVED_TO_FAILED
                          }
                      }
                  }
                  fun sync(): List<ProcessResult> {
                      val results = mutableListOf<ProcessResult>()
                      while (queue.isNotEmpty()) { val result = processNext(); results += result; if (result == ProcessResult.WILL_RETRY) break }
                      return results
                  }
              }
            hints:
              - Inspect only `queue.firstOrNull()` and do not remove it before sending.
              - Remove successful or permanent payments, but leave retryable payments in place.
            expected: |
              Queue [p1, p2], the sender answers `SUCCESS` then `RETRYABLE`, and `processNext()` is called twice: `[SENT, WILL_RETRY] · pending [p2] · failed []`.

          - id: kotlin-ch09-offline-part-3
            prompt: "Implement `sync()`: send in order and stop at the first `RETRYABLE`. A `PERMANENT` result moves aside and sync continues. Always use the payment id as its idempotency key."
            starter_code: |
              data class Payment(val id: String, val amountCents: Long)
              enum class SendResult { SUCCESS, RETRYABLE, PERMANENT }
              enum class ProcessResult { SENT, WILL_RETRY, MOVED_TO_FAILED, EMPTY }
              fun interface PaymentSender { fun send(payment: Payment, idempotencyKey: String): SendResult }

              class OfflineQueue(private val sender: PaymentSender) {
                  private val queue = ArrayDeque<Payment>()
                  private val knownIds = mutableSetOf<String>()
                  private val failedPayments = mutableListOf<Payment>()
                  fun enqueue(id: String, amountCents: Long): Boolean {
                      if (amountCents <= 0 || id in knownIds) return false
                      knownIds += id; queue.addLast(Payment(id, amountCents)); return true
                  }
                  fun pending(): List<Payment> = queue.toList()
                  fun failed(): List<Payment> = failedPayments.toList()
                  fun processNext(): ProcessResult = TODO()
                  fun sync(): List<ProcessResult> = TODO()
              }
            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class OfflineQueuePart3Test {
                  private class FakeSender(private vararg val scripted: SendResult) : PaymentSender {
                      private var index = 0
                      val keys = mutableListOf<String>()
                      override fun send(payment: Payment, idempotencyKey: String): SendResult {
                          keys += idempotencyKey
                          return scripted[index++]
                      }
                  }

                  @Test fun retryStopsSyncAndReusesTheSameKey() {
                      val sender = FakeSender(SendResult.RETRYABLE, SendResult.SUCCESS, SendResult.SUCCESS)
                      val queue = OfflineQueue(sender)
                      queue.enqueue("p1", 500); queue.enqueue("p2", 700)
                      assertEquals(listOf(ProcessResult.WILL_RETRY), queue.sync())
                      assertEquals(listOf(ProcessResult.SENT, ProcessResult.SENT), queue.sync())
                      assertEquals(listOf("p1", "p1", "p2"), sender.keys)
                      assertEquals(emptyList<Payment>(), queue.pending())
                  }

                  @Test fun permanentFailureDoesNotBlockLaterPayments() {
                      val queue = OfflineQueue(FakeSender(SendResult.PERMANENT, SendResult.SUCCESS, SendResult.SUCCESS))
                      queue.enqueue("p1", 100); queue.enqueue("p2", 200); queue.enqueue("p3", 300)
                      assertEquals(listOf(ProcessResult.MOVED_TO_FAILED, ProcessResult.SENT, ProcessResult.SENT), queue.sync())
                      assertEquals(listOf(Payment("p1", 100)), queue.failed())
                  }
              }
            reference_solution: |
              data class Payment(val id: String, val amountCents: Long)
              enum class SendResult { SUCCESS, RETRYABLE, PERMANENT }
              enum class ProcessResult { SENT, WILL_RETRY, MOVED_TO_FAILED, EMPTY }
              fun interface PaymentSender { fun send(payment: Payment, idempotencyKey: String): SendResult }

              class OfflineQueue(private val sender: PaymentSender) {
                  private val queue = ArrayDeque<Payment>()
                  private val knownIds = mutableSetOf<String>()
                  private val failedPayments = mutableListOf<Payment>()
                  fun enqueue(id: String, amountCents: Long): Boolean {
                      if (amountCents <= 0 || id in knownIds) return false
                      knownIds += id; queue.addLast(Payment(id, amountCents)); return true
                  }
                  fun pending(): List<Payment> = queue.toList()
                  fun failed(): List<Payment> = failedPayments.toList()
                  fun processNext(): ProcessResult {
                      val payment = queue.firstOrNull() ?: return ProcessResult.EMPTY
                      return when (sender.send(payment, payment.id)) {
                          SendResult.SUCCESS -> { queue.removeFirst(); ProcessResult.SENT }
                          SendResult.RETRYABLE -> ProcessResult.WILL_RETRY
                          SendResult.PERMANENT -> { queue.removeFirst(); failedPayments += payment; ProcessResult.MOVED_TO_FAILED }
                      }
                  }
                  fun sync(): List<ProcessResult> {
                      val results = mutableListOf<ProcessResult>()
                      while (queue.isNotEmpty()) { val result = processNext(); results += result; if (result == ProcessResult.WILL_RETRY) break }
                      return results
                  }
              }
            hints:
              - Reuse `processNext()` in a loop and append each result.
              - Break only after `WILL_RETRY`; permanent failures are safe to skip.
            expected: |
              Queue [p1, p2]; the sender answers `RETRYABLE`, then `SUCCESS`, `SUCCESS`: first sync → `[WILL_RETRY]` · second sync → `[SENT, SENT]` · keys sent `[p1, p1, p2]` · pending `[]`.

              Queue [p1, p2, p3]; the sender answers `PERMANENT`, `SUCCESS`, `SUCCESS`: `sync() → [MOVED_TO_FAILED, SENT, SENT] · failed [p1]`.

        faq:
          - question: Can a later payment skip one that's retrying?
            answer: No. Keep the order.
          - question: Duplicate ids?
            answer: Return false and ignore them.
          - question: Thread safety?
            answer: Not needed.
          - question: How do I test without a network?
            answer: Pass in a fake sender that returns scripted answers (Lesson 8).
        discussion: |
          Discuss crash recovery, idempotency, durable queue storage, and practical size and retention limits. The persisted queue still contains a payment after a crash, so restart resends it; reusing the same idempotency key lets the server recognize the earlier logical operation instead of authorizing the card twice. Persist the queue and keys in transactional durable storage, with encryption, retention and count/byte limits, retry metadata, expiry rules, monitoring, and an operator path for permanent failures.
        source_note: Stripe's published sample, paraphrased

  - id: kotlin-ch09-telemetry-batcher
    title: Telemetry batcher
    explanation: |
      A reader SDK collects diagnostic events and uploads them when a batch is full or the oldest event is old enough. Inject time and uploading so tests never wait or use a network. Failed uploads retain events, and capacity drops the oldest event.
    exercises:
      - type: multi_part_problem
        id: kotlin-ch09-ex-telemetry-batcher
        prompt: Build an ordered telemetry batcher with size, age, upload, and storage-capacity rules.
        story: |
          A reader SDK collects diagnostic events and uploads them in batches without letting offline storage grow forever.
        parts:
          - id: kotlin-ch09-batcher-part-1
            prompt: A batch is ready when it holds N events. `add(event)` returns the batch to upload, or an empty list.
            starter_code: |
              data class StoredEvent(val value: String, val addedAt: Long)
              fun interface Clock { fun nowMillis(): Long }
              fun interface TelemetryUploader { fun upload(events: List<StoredEvent>): Boolean }

              class TelemetryBatcher(
                  private val batchSize: Int,
                  private val maxAgeMillis: Long = Long.MAX_VALUE,
                  private val capacity: Int = Int.MAX_VALUE,
                  private val clock: Clock = Clock { 0L }
              ) {
                  fun add(value: String): List<StoredEvent> = TODO()
                  fun check(): List<StoredEvent> = TODO()
                  fun upload(uploader: TelemetryUploader): List<StoredEvent> = TODO()
                  fun stored(): List<StoredEvent> = TODO()
                  fun dropped(): List<StoredEvent> = TODO()
                  fun setOnline(online: Boolean) = TODO()
              }
            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class TelemetryBatcherPart1Test {
                  @Test fun returnsAFullBatchOnlyAtN() {
                      val batcher = TelemetryBatcher(3)
                      assertEquals(emptyList<StoredEvent>(), batcher.add("a"))
                      assertEquals(emptyList<StoredEvent>(), batcher.add("b"))
                      assertEquals(listOf(StoredEvent("a", 0), StoredEvent("b", 0), StoredEvent("c", 0)), batcher.add("c"))
                  }

                  @Test fun doesNotReturnBeforeTheConfiguredSize() {
                      val batcher = TelemetryBatcher(2)
                      assertEquals(emptyList<StoredEvent>(), batcher.add("a"))
                      assertEquals(listOf(StoredEvent("a", 0), StoredEvent("b", 0)), batcher.add("b"))
                  }
              }
            reference_solution: |
              data class StoredEvent(val value: String, val addedAt: Long)
              fun interface Clock { fun nowMillis(): Long }
              fun interface TelemetryUploader { fun upload(events: List<StoredEvent>): Boolean }

              class TelemetryBatcher(
                  private val batchSize: Int,
                  private val maxAgeMillis: Long = Long.MAX_VALUE,
                  private val capacity: Int = Int.MAX_VALUE,
                  private val clock: Clock = Clock { 0L }
              ) {
                  private val events = ArrayDeque<StoredEvent>()
                  private val droppedEvents = mutableListOf<StoredEvent>()
                  private var online = true

                  fun add(value: String): List<StoredEvent> {
                      events.addLast(StoredEvent(value, clock.nowMillis()))
                      while (events.size > capacity) droppedEvents += events.removeFirst()
                      return if (online && events.size >= batchSize) events.take(batchSize) else emptyList()
                  }

                  fun check(): List<StoredEvent> {
                      val first = events.firstOrNull() ?: return emptyList()
                      return if (online && clock.nowMillis() - first.addedAt >= maxAgeMillis) events.take(batchSize) else emptyList()
                  }

                  fun upload(uploader: TelemetryUploader): List<StoredEvent> {
                      if (!online || events.isEmpty()) return emptyList()
                      val batch = events.take(batchSize)
                      if (!uploader.upload(batch)) return emptyList()
                      repeat(batch.size) { events.removeFirst() }
                      return batch
                  }

                  fun stored(): List<StoredEvent> = events.toList()
                  fun dropped(): List<StoredEvent> = droppedEvents.toList()
                  fun setOnline(online: Boolean) { this.online = online }
              }
            hints:
              - Record each event in order and compare the size after adding it.
              - Keep the returned batch available until a later successful upload acknowledges it.
            expected: |
              N = 3: `add a → [] · add b → [] · add c → [a, b, c]`.

          - id: kotlin-ch09-batcher-part-2
            prompt: Inject a clock. Flush a non-empty batch once its oldest event is at least T milliseconds old.
            starter_code: |
              data class StoredEvent(val value: String, val addedAt: Long)
              fun interface Clock { fun nowMillis(): Long }
              fun interface TelemetryUploader { fun upload(events: List<StoredEvent>): Boolean }

              class TelemetryBatcher(
                  private val batchSize: Int,
                  private val maxAgeMillis: Long = Long.MAX_VALUE,
                  private val capacity: Int = Int.MAX_VALUE,
                  private val clock: Clock = Clock { 0L }
              ) {
                  fun add(value: String): List<StoredEvent> = TODO()
                  fun check(): List<StoredEvent> = TODO()
                  fun upload(uploader: TelemetryUploader): List<StoredEvent> = TODO()
                  fun stored(): List<StoredEvent> = TODO()
                  fun dropped(): List<StoredEvent> = TODO()
                  fun setOnline(online: Boolean) = TODO()
              }
            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class TelemetryBatcherPart2Test {
                  private class FakeClock(var now: Long) : Clock { override fun nowMillis() = now }

                  @Test fun ageCheckIsInclusive() {
                      val clock = FakeClock(100)
                      val batcher = TelemetryBatcher(3, 1000, clock = clock)
                      batcher.add("a")
                      clock.now = 1099
                      assertEquals(emptyList<StoredEvent>(), batcher.check())
                      clock.now = 1100
                      assertEquals(listOf(StoredEvent("a", 100)), batcher.check())
                  }

                  @Test fun emptyBatchIsNeverDue() {
                      val clock = FakeClock(500)
                      assertEquals(emptyList<StoredEvent>(), TelemetryBatcher(2, 0, clock = clock).check())
                  }
              }
            reference_solution: |
