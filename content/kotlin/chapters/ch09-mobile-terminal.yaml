                  private val capacity: Int = Int.MAX_VALUE,
                  private val clock: Clock = Clock { 0L }
              ) {
                  private val events = ArrayDeque<StoredEvent>()
                  private val droppedEvents = mutableListOf<StoredEvent>()
                  private var online = true
                  fun add(value: String): List<StoredEvent> {
                      events.addLast(StoredEvent(value, clock.nowMillis()))
                      while (events.size > capacity) droppedEvents += events.removeFirst()
                      return if (online && events.size >= batchSize) events.take(batchSize) else emptyList()
                  }
                  fun check(): List<StoredEvent> {
                      val first = events.firstOrNull() ?: return emptyList()
                      return if (online && clock.nowMillis() - first.addedAt >= maxAgeMillis) events.take(batchSize) else emptyList()
                  }
                  fun upload(uploader: TelemetryUploader): List<StoredEvent> {
                      if (!online || events.isEmpty()) return emptyList()
                      val batch = events.take(batchSize)
                      if (!uploader.upload(batch)) return emptyList()
                      repeat(batch.size) { events.removeFirst() }
                      return batch
                  }
                  fun stored(): List<StoredEvent> = events.toList()
                  fun dropped(): List<StoredEvent> = droppedEvents.toList()
                  fun setOnline(online: Boolean) { this.online = online }
              }
            hints:
              - Keep failed events at the front and make capacity eviction remove from the front.
              - Remove a batch only after `upload` returns true; call upload again for the remainder.
            expected: |
              `dropped [e1] · sent [[e2, e3, e4], [e5]] · stored []`.

        faq:
          - question: Is the age check "at least T"?
            answer: Yes, `>= T`.
          - question: Does a failed upload lose events?
            answer: No.
          - question: Which event is dropped at the cap?
            answer: The oldest.
          - question: How do tests control time?
            answer: A `Clock` interface with a fake you set by hand.
        discussion: |
          Consider delivery semantics, lifecycle ownership, shutdown behavior, and privacy boundaries for diagnostics. At-least-once delivery permits duplicates, so events need stable ids and server-side deduplication where duplicates matter. The lifecycle or scheduler can wake the batcher, while the batcher owns readiness. Shutdown flushing is best effort; durable storage is the guarantee. Telemetry must exclude card numbers, authentication data, secrets, and unnecessary customer identifiers, using allowlists, redaction, size limits, retention controls, and access controls.
        source_note: Stripe's published sample, paraphrased

  - id: kotlin-ch09-checkout-retries
    title: Checkout retries
    explanation: |
      Each order gets exactly one PaymentIntent. Declines and temporary connectivity problems reuse it; approved payments are captured; unknown outcomes must be reconciled instead of creating a replacement intent.
    exercises:
      - type: multi_part_problem
        id: kotlin-ch09-ex-checkout-retries
        prompt: Model the retry rules without creating a new PaymentIntent during retries.
        story: |
          This is a simplified model of Stripe Terminal payment behavior, not the real SDK API. Each attempt returns APPROVED, DECLINED, CONNECTIVITY, TIMEOUT, or CANCELED_BY_READER.
        parts:
          - id: kotlin-ch09-checkout-part-1
            prompt: Given outcomes in order, create one intent. On DECLINED ask for another card; on CONNECTIVITY or TIMEOUT process again with the same intent; on APPROVED capture and stop. Return final status and process-attempt count.
            starter_code: |
              enum class AttemptOutcome { APPROVED, DECLINED, CONNECTIVITY, TIMEOUT, CANCELED_BY_READER }
              enum class CheckoutStatus { CAPTURED, FAILED_DECLINED, CANCELED, NEEDS_RECONCILIATION, AUTHORIZED_NOT_CAPTURED }
              data class CheckoutResult(val status: CheckoutStatus, val attempts: Int, val intentId: String, val paymentIntentsCreated: Int = 1)

              fun runCheckout(
                  outcomes: List<AttemptOutcome>,
                  intentId: String = "pi_1",
                  captureSucceeds: Boolean = true,
                  useLimits: Boolean = true
              ): CheckoutResult = TODO()

              data class OrderInput(val orderId: String, val outcomes: List<AttemptOutcome>, val captureSucceeds: Boolean)
              data class OrderResult(val orderId: String, val status: CheckoutStatus, val intentId: String)
              data class MultiOrderResult(val orders: List<OrderResult>, val followUps: List<String>, val paymentIntentsCreated: Int)
              fun runOrders(orders: List<OrderInput>): MultiOrderResult = TODO()
            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class CheckoutRetriesPart1Test {
                  @Test fun reusesOneIntentThroughDeclineAndTimeout() {
                      assertEquals(CheckoutResult(CheckoutStatus.CAPTURED, 3, "pi_1", 1), runCheckout(listOf(AttemptOutcome.DECLINED, AttemptOutcome.TIMEOUT, AttemptOutcome.APPROVED), useLimits = false))
                  }

                  @Test fun emptyOutcomesNeedReconciliation() {
                      assertEquals(CheckoutResult(CheckoutStatus.NEEDS_RECONCILIATION, 0, "pi_1", 1), runCheckout(emptyList(), useLimits = false))
                  }
              }
            reference_solution: |
              enum class AttemptOutcome { APPROVED, DECLINED, CONNECTIVITY, TIMEOUT, CANCELED_BY_READER }
              enum class CheckoutStatus { CAPTURED, FAILED_DECLINED, CANCELED, NEEDS_RECONCILIATION, AUTHORIZED_NOT_CAPTURED }
              data class CheckoutResult(val status: CheckoutStatus, val attempts: Int, val intentId: String, val paymentIntentsCreated: Int = 1)

              fun runCheckout(outcomes: List<AttemptOutcome>, intentId: String = "pi_1", captureSucceeds: Boolean = true, useLimits: Boolean = true): CheckoutResult {
                  var attempts = 0
                  for (outcome in outcomes) {
                      attempts++
                      when (outcome) {
                          AttemptOutcome.APPROVED -> return CheckoutResult(if (captureSucceeds) CheckoutStatus.CAPTURED else CheckoutStatus.AUTHORIZED_NOT_CAPTURED, attempts, intentId)
                          AttemptOutcome.CANCELED_BY_READER -> return CheckoutResult(CheckoutStatus.CANCELED, attempts, intentId)
                          AttemptOutcome.DECLINED, AttemptOutcome.CONNECTIVITY, AttemptOutcome.TIMEOUT -> Unit
                      }
                  }
                  return CheckoutResult(CheckoutStatus.NEEDS_RECONCILIATION, attempts, intentId)
              }

              data class OrderInput(val orderId: String, val outcomes: List<AttemptOutcome>, val captureSucceeds: Boolean)
              data class OrderResult(val orderId: String, val status: CheckoutStatus, val intentId: String)
              data class MultiOrderResult(val orders: List<OrderResult>, val followUps: List<String>, val paymentIntentsCreated: Int)
              fun runOrders(orders: List<OrderInput>): MultiOrderResult = orders.mapIndexed { index, order ->
                  val id = "pi_${index + 1}"
                  OrderResult(order.orderId, runCheckout(order.outcomes, id, order.captureSucceeds, true).status, id)
              }.let { results -> MultiOrderResult(results, emptyList(), orders.size) }
            hints:
              - Count attempts as you consume outcomes and return immediately for APPROVED or CANCELED_BY_READER.
              - A timeout with no later result leaves the intent in an unknown state.
            expected: |
              `[DECLINED, TIMEOUT, APPROVED] → CAPTURED after 3 attempts, 1 PaymentIntent created`.

          - id: kotlin-ch09-checkout-part-2
            prompt: Add limits. After 3 consecutive CONNECTIVITY or TIMEOUT results, stop with `NEEDS_RECONCILIATION`. Two declines stop with `FAILED_DECLINED`. `CANCELED_BY_READER` stops with `CANCELED`.
            starter_code: |
              enum class AttemptOutcome { APPROVED, DECLINED, CONNECTIVITY, TIMEOUT, CANCELED_BY_READER }
              enum class CheckoutStatus { CAPTURED, FAILED_DECLINED, CANCELED, NEEDS_RECONCILIATION, AUTHORIZED_NOT_CAPTURED }
              data class CheckoutResult(val status: CheckoutStatus, val attempts: Int, val intentId: String, val paymentIntentsCreated: Int = 1)
              fun runCheckout(outcomes: List<AttemptOutcome>, intentId: String = "pi_1", captureSucceeds: Boolean = true, useLimits: Boolean = true): CheckoutResult = TODO()
              data class OrderInput(val orderId: String, val outcomes: List<AttemptOutcome>, val captureSucceeds: Boolean)
              data class OrderResult(val orderId: String, val status: CheckoutStatus, val intentId: String)
              data class MultiOrderResult(val orders: List<OrderResult>, val followUps: List<String>, val paymentIntentsCreated: Int)
              fun runOrders(orders: List<OrderInput>): MultiOrderResult = TODO()
            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class CheckoutRetriesPart2Test {
                  @Test fun threeUnknownResultsReconcile() {
                      assertEquals(CheckoutResult(CheckoutStatus.NEEDS_RECONCILIATION, 3, "pi_1", 1), runCheckout(listOf(AttemptOutcome.TIMEOUT, AttemptOutcome.TIMEOUT, AttemptOutcome.TIMEOUT, AttemptOutcome.APPROVED)))
                  }
                  @Test fun declinesCancelAndResetTheUnknownRun() {
                      assertEquals(CheckoutResult(CheckoutStatus.FAILED_DECLINED, 2, "pi_1", 1), runCheckout(listOf(AttemptOutcome.DECLINED, AttemptOutcome.DECLINED, AttemptOutcome.APPROVED)))
                      assertEquals(CheckoutResult(CheckoutStatus.CANCELED, 2, "pi_1", 1), runCheckout(listOf(AttemptOutcome.CONNECTIVITY, AttemptOutcome.CANCELED_BY_READER)))
                      assertEquals(CheckoutResult(CheckoutStatus.CAPTURED, 5, "pi_1", 1), runCheckout(listOf(AttemptOutcome.TIMEOUT, AttemptOutcome.DECLINED, AttemptOutcome.TIMEOUT, AttemptOutcome.TIMEOUT, AttemptOutcome.APPROVED)))
                  }
              }
            reference_solution: |
              enum class AttemptOutcome { APPROVED, DECLINED, CONNECTIVITY, TIMEOUT, CANCELED_BY_READER }
              enum class CheckoutStatus { CAPTURED, FAILED_DECLINED, CANCELED, NEEDS_RECONCILIATION, AUTHORIZED_NOT_CAPTURED }
              data class CheckoutResult(val status: CheckoutStatus, val attempts: Int, val intentId: String, val paymentIntentsCreated: Int = 1)
              fun runCheckout(outcomes: List<AttemptOutcome>, intentId: String = "pi_1", captureSucceeds: Boolean = true, useLimits: Boolean = true): CheckoutResult {
                  var attempts = 0; var declines = 0; var consecutiveUnknown = 0
                  for (outcome in outcomes) {
                      attempts++
                      when (outcome) {
                          AttemptOutcome.APPROVED -> return CheckoutResult(if (captureSucceeds) CheckoutStatus.CAPTURED else CheckoutStatus.AUTHORIZED_NOT_CAPTURED, attempts, intentId)
                          AttemptOutcome.CANCELED_BY_READER -> return CheckoutResult(CheckoutStatus.CANCELED, attempts, intentId)
                          AttemptOutcome.DECLINED -> { declines++; consecutiveUnknown = 0; if (useLimits && declines >= 2) return CheckoutResult(CheckoutStatus.FAILED_DECLINED, attempts, intentId) }
                          AttemptOutcome.CONNECTIVITY, AttemptOutcome.TIMEOUT -> { consecutiveUnknown++; if (useLimits && consecutiveUnknown >= 3) return CheckoutResult(CheckoutStatus.NEEDS_RECONCILIATION, attempts, intentId) }
                      }
                  }
                  return CheckoutResult(CheckoutStatus.NEEDS_RECONCILIATION, attempts, intentId)
              }
              data class OrderInput(val orderId: String, val outcomes: List<AttemptOutcome>, val captureSucceeds: Boolean)
              data class OrderResult(val orderId: String, val status: CheckoutStatus, val intentId: String)
              data class MultiOrderResult(val orders: List<OrderResult>, val followUps: List<String>, val paymentIntentsCreated: Int)
              fun runOrders(orders: List<OrderInput>): MultiOrderResult {
                  val results = mutableListOf<OrderResult>()
                  val followUps = mutableListOf<String>()
                  orders.forEachIndexed { index, order ->
                      val intentId = "pi_${index + 1}"
                      val status = runCheckout(order.outcomes, intentId, order.captureSucceeds, true).status
                      results += OrderResult(order.orderId, status, intentId)
                      when (status) {
                          CheckoutStatus.AUTHORIZED_NOT_CAPTURED -> followUps += "$intentId capture or cancel within 2 days"
                          CheckoutStatus.NEEDS_RECONCILIATION -> followUps += "$intentId check its status before doing anything"
                          else -> Unit
                      }
                  }
                  return MultiOrderResult(results, followUps, orders.size)
              }
            hints:
              - Track `declines` separately from the consecutive unknown count.
              - Reset the unknown count on a decline and stop before consuming the fourth timeout.
            expected: |
              `[TIMEOUT, TIMEOUT, TIMEOUT, APPROVED] → NEEDS_RECONCILIATION after 3 · [DECLINED, DECLINED, APPROVED] → FAILED_DECLINED after 2 · [CONNECTIVITY, CANCELED_BY_READER] → CANCELED after 2 · [TIMEOUT, DECLINED, TIMEOUT, TIMEOUT, APPROVED] → CAPTURED after 5` (the decline breaks the run of timeouts).

          - id: kotlin-ch09-checkout-part-3
            prompt: Handle several orders, each with its own intent (`pi_1`, `pi_2`, …), and capture failures. Report each status and a follow-up list.
            starter_code: |
              enum class AttemptOutcome { APPROVED, DECLINED, CONNECTIVITY, TIMEOUT, CANCELED_BY_READER }
              enum class CheckoutStatus { CAPTURED, FAILED_DECLINED, CANCELED, NEEDS_RECONCILIATION, AUTHORIZED_NOT_CAPTURED }
              data class CheckoutResult(val status: CheckoutStatus, val attempts: Int, val intentId: String, val paymentIntentsCreated: Int = 1)
              fun runCheckout(outcomes: List<AttemptOutcome>, intentId: String = "pi_1", captureSucceeds: Boolean = true, useLimits: Boolean = true): CheckoutResult = TODO()
              data class OrderInput(val orderId: String, val outcomes: List<AttemptOutcome>, val captureSucceeds: Boolean)
              data class OrderResult(val orderId: String, val status: CheckoutStatus, val intentId: String)
              data class MultiOrderResult(val orders: List<OrderResult>, val followUps: List<String>, val paymentIntentsCreated: Int)
              fun runOrders(orders: List<OrderInput>): MultiOrderResult = TODO()
            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class CheckoutRetriesPart3Test {
                  @Test fun reportsStatusesFollowUpsAndIntentCount() {
                      val result = runOrders(listOf(
                          OrderInput("A", listOf(AttemptOutcome.APPROVED), true),
                          OrderInput("B", listOf(AttemptOutcome.DECLINED, AttemptOutcome.APPROVED), false),
                          OrderInput("C", listOf(AttemptOutcome.TIMEOUT, AttemptOutcome.TIMEOUT, AttemptOutcome.TIMEOUT), true)
                      ))
                      assertEquals(listOf(OrderResult("A", CheckoutStatus.CAPTURED, "pi_1"), OrderResult("B", CheckoutStatus.AUTHORIZED_NOT_CAPTURED, "pi_2"), OrderResult("C", CheckoutStatus.NEEDS_RECONCILIATION, "pi_3")), result.orders)
                      assertEquals(listOf("pi_2 capture or cancel within 2 days", "pi_3 check its status before doing anything"), result.followUps)
                      assertEquals(3, result.paymentIntentsCreated)
                  }
                  @Test fun noOrdersCreateNoIntents() {
                      assertEquals(MultiOrderResult(emptyList(), emptyList(), 0), runOrders(emptyList()))
                  }
              }
            reference_solution: |
              enum class AttemptOutcome { APPROVED, DECLINED, CONNECTIVITY, TIMEOUT, CANCELED_BY_READER }
              enum class CheckoutStatus { CAPTURED, FAILED_DECLINED, CANCELED, NEEDS_RECONCILIATION, AUTHORIZED_NOT_CAPTURED }
              data class CheckoutResult(val status: CheckoutStatus, val attempts: Int, val intentId: String, val paymentIntentsCreated: Int = 1)
              fun runCheckout(outcomes: List<AttemptOutcome>, intentId: String = "pi_1", captureSucceeds: Boolean = true, useLimits: Boolean = true): CheckoutResult {
                  var attempts = 0; var declines = 0; var unknown = 0
                  for (outcome in outcomes) {
                      attempts++
                      when (outcome) {
                          AttemptOutcome.APPROVED -> return CheckoutResult(if (captureSucceeds) CheckoutStatus.CAPTURED else CheckoutStatus.AUTHORIZED_NOT_CAPTURED, attempts, intentId)
                          AttemptOutcome.CANCELED_BY_READER -> return CheckoutResult(CheckoutStatus.CANCELED, attempts, intentId)
                          AttemptOutcome.DECLINED -> { declines++; unknown = 0; if (useLimits && declines >= 2) return CheckoutResult(CheckoutStatus.FAILED_DECLINED, attempts, intentId) }
                          AttemptOutcome.CONNECTIVITY, AttemptOutcome.TIMEOUT -> { unknown++; if (useLimits && unknown >= 3) return CheckoutResult(CheckoutStatus.NEEDS_RECONCILIATION, attempts, intentId) }
                      }
                  }
                  return CheckoutResult(CheckoutStatus.NEEDS_RECONCILIATION, attempts, intentId)
              }
              data class OrderInput(val orderId: String, val outcomes: List<AttemptOutcome>, val captureSucceeds: Boolean)
              data class OrderResult(val orderId: String, val status: CheckoutStatus, val intentId: String)
              data class MultiOrderResult(val orders: List<OrderResult>, val followUps: List<String>, val paymentIntentsCreated: Int)
              fun runOrders(orders: List<OrderInput>): MultiOrderResult {
                  val results = mutableListOf<OrderResult>(); val followUps = mutableListOf<String>()
                  orders.forEachIndexed { index, order ->
                      val intentId = "pi_${index + 1}"
                      val status = runCheckout(order.outcomes, intentId, order.captureSucceeds, true).status
                      results += OrderResult(order.orderId, status, intentId)
                      when (status) {
                          CheckoutStatus.AUTHORIZED_NOT_CAPTURED -> followUps += "$intentId capture or cancel within 2 days"
                          CheckoutStatus.NEEDS_RECONCILIATION -> followUps += "$intentId check its status before doing anything"
                          else -> Unit
                      }
                  }
                  return MultiOrderResult(results, followUps, orders.size)
              }
            hints:
              - Assign intent ids from the order index and call the part-2 flow for each order.
              - Add follow-ups only for authorized-but-uncaptured and reconciliation outcomes.
            expected: |
              A: `CAPTURED (pi_1)` · B: `AUTHORIZED_NOT_CAPTURED (pi_2)` · C: `NEEDS_RECONCILIATION (pi_3)`. Follow-ups: `pi_2 capture or cancel within 2 days`; `pi_3 check its status before doing anything`. Three PaymentIntents total.

        faq:
          - question: Does a decline reset the timeout count?
            answer: Yes. The limit is for consecutive results.
          - question: Is APPROVED final?
            answer: Yes. Capture, then stop.
          - question: Intent ids?
            answer: "`pi_1`, `pi_2`, … in order of creation."
          - question: Is this the real SDK?
            answer: No. It models the rules from Stripe's docs.
        discussion: |
          Keep the PaymentIntent identity stable across retries and reconcile unknown outcomes before attempting anything new. A timeout leaves the payment outcome unknown; creating a new intent can authorize the card twice. Save the original PaymentIntent id and stable operation state before processing, then reconcile that same intent after a crash. Offline mode adds durable storage and forwarding, but still needs one stable payment identity and explicit stored, authorized, captured, and unknown states.
        source_note: Stripe's published sample, paraphrased

  - id: kotlin-ch09-version-gate-rollout
    title: Version gate and rollout
    explanation: |
      Parse exactly three numeric version components before comparing them. A supported install can then be assigned a stable rollout bucket based on its id.
    exercises:
      - type: multi_part_problem
        id: kotlin-ch09-ex-version-gate-rollout
        prompt: Parse and compare versions, return typed eligibility results, and apply a deterministic staged rollout.
        story: |
          A new Terminal feature needs a minimum app version and turns on gradually across installs.
        parts:
          - id: kotlin-ch09-version-part-1
            prompt: Parse versions as `major.minor.patch` (three non-negative integers) and compare them.
            starter_code: |
              data class AppVersion(val major: Int, val minor: Int, val patch: Int)
              fun compareVersions(left: String, right: String): Int = TODO()
              fun gateVersion(version: String, minimum: String): FeatureResult = TODO()
              fun rolloutVersion(version: String, minimum: String, installId: String, percentage: Int): FeatureResult = TODO()

              sealed interface FeatureResult {
                  data object Enabled : FeatureResult
                  data object TooOld : FeatureResult
                  data object InvalidVersion : FeatureResult
                  data object DisabledByRollout : FeatureResult
              }
            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class VersionGatePart1Test {
                  @Test fun comparesNumericComponentsNotStrings() {
                      assertEquals(1, compareVersions("2.10.0", "2.9.8"))
                      assertEquals(0, compareVersions("1.2.3", "1.2.3"))
                      assertEquals(-1, compareVersions("1.0.9", "1.1.0"))
                  }
                  @Test fun leadingZerosAreNumeric() {
                      assertEquals(0, compareVersions("01.002.0003", "1.2.3"))
                  }
              }
            reference_solution: |
              data class AppVersion(val major: Int, val minor: Int, val patch: Int)
              sealed interface FeatureResult {
                  data object Enabled : FeatureResult
                  data object TooOld : FeatureResult
                  data object InvalidVersion : FeatureResult
                  data object DisabledByRollout : FeatureResult
              }
              private fun parseVersion(text: String): AppVersion? = try {
                  val parts = text.split('.')
                  if (parts.size != 3 || parts.any { it.isEmpty() || it.any { ch -> !ch.isDigit() } }) null
                  else AppVersion(parts[0].toInt(), parts[1].toInt(), parts[2].toInt())
              } catch (e: NumberFormatException) { null }
              fun compareVersions(left: String, right: String): Int {
                  val a = requireNotNull(parseVersion(left)); val b = requireNotNull(parseVersion(right))
                  return compareValuesBy(a, b, { it.major }, { it.minor }, { it.patch })
              }
              fun gateVersion(version: String, minimum: String): FeatureResult {
                  val actual = parseVersion(version) ?: return FeatureResult.InvalidVersion
                  val required = parseVersion(minimum) ?: return FeatureResult.InvalidVersion
                  return if (compareValuesBy(actual, required, { it.major }, { it.minor }, { it.patch }) >= 0) FeatureResult.Enabled else FeatureResult.TooOld
              }
              fun rolloutVersion(version: String, minimum: String, installId: String, percentage: Int): FeatureResult {
                  if (gateVersion(version, minimum) != FeatureResult.Enabled) return gateVersion(version, minimum)
                  val bucket = installId.sumOf { it.code } % 100
                  return if (bucket < percentage) FeatureResult.Enabled else FeatureResult.DisabledByRollout
              }
            hints:
              - Split on `.` and require exactly three non-empty digit strings.
              - Compare major, then minor, then patch; do not compare the original strings.
            expected: |
              `compare("2.10.0", "2.9.8") → 1 · compare("1.2.3", "1.2.3") → 0 · compare("1.0.9", "1.1.0") → -1`.

          - id: kotlin-ch09-version-part-2
            prompt: "Check against a minimum version and return a sealed result: `Enabled`, `TooOld`, or `InvalidVersion`."
            starter_code: |
              data class AppVersion(val major: Int, val minor: Int, val patch: Int)
              sealed interface FeatureResult {
                  data object Enabled : FeatureResult
                  data object TooOld : FeatureResult
                  data object InvalidVersion : FeatureResult
                  data object DisabledByRollout : FeatureResult
              }
