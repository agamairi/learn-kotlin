        faq:
          - question: Does a decline reset the timeout count?
            answer: Yes. The limit is for consecutive results.
          - question: Is APPROVED final?
            answer: Yes. Capture, then stop.
          - question: Intent ids?
            answer: "`pi_1`, `pi_2`, … in order of creation."
          - question: Is this the real SDK?
            answer: No. It models the rules from Stripe's docs.
        discussion: |
          Keep the PaymentIntent identity stable across retries and reconcile unknown outcomes before attempting anything new. A timeout leaves the payment outcome unknown; creating a new intent can authorize the card twice. Save the original PaymentIntent id and stable operation state before processing, then reconcile that same intent after a crash. Offline mode adds durable storage and forwarding, but still needs one stable payment identity and explicit stored, authorized, captured, and unknown states.
        source_note: Stripe's published sample, paraphrased

