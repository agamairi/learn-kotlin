id: ch09-mobile-terminal
title: "Stripe practice: mobile and Terminal"
summary: Six multi-part Kotlin problems about offline payments, readers, retries, rollout, routing, and telemetry.
lessons:
  - id: kotlin-ch09-offline-payment-queue
    title: Offline payment queue
    explanation: |
      A point-of-sale app can accept payments while offline and forward them later. Keep the queue FIFO, reject duplicate ids, retry a temporary failure at the head, and move permanent failures aside. The sender is an injected interface, so the queue can be tested without a network.
    exercises:
      - type: multi_part_problem
        id: kotlin-ch09-ex-offline-payment-queue
        prompt: Implement the queue one part at a time. Keep payment ids as the idempotency keys used for every send.
        story: |
          Stripe Terminal can store payments while offline and forward them when the connection returns. This plain Kotlin model has no Android APIs and no threads.
        parts:
          - id: kotlin-ch09-offline-part-1
            prompt: "Implement `enqueue(id, amountCents): Boolean` and `pending()`. Reject amounts of zero or less and duplicate ids by returning false."
            starter_code: |
              data class Payment(val id: String, val amountCents: Long)

              enum class SendResult { SUCCESS, RETRYABLE, PERMANENT }

              enum class ProcessResult { SENT, WILL_RETRY, MOVED_TO_FAILED, EMPTY }

              fun interface PaymentSender {
                  fun send(payment: Payment, idempotencyKey: String): SendResult
              }

              class OfflineQueue(private val sender: PaymentSender) {
                  fun enqueue(id: String, amountCents: Long): Boolean = TODO()
                  fun pending(): List<Payment> = TODO()
                  fun failed(): List<Payment> = TODO()
                  fun processNext(): ProcessResult = TODO()
                  fun sync(): List<ProcessResult> = TODO()
              }
            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class OfflineQueuePart1Test {
                  private class FakeSender : PaymentSender {
                      override fun send(payment: Payment, idempotencyKey: String) = SendResult.SUCCESS
                  }

                  @Test fun acceptsPositivePaymentsAndRejectsDuplicatesAndNonPositiveAmounts() {
                      val queue = OfflineQueue(FakeSender())
                      assertEquals(true, queue.enqueue("p1", 500))
                      assertEquals(true, queue.enqueue("p2", 700))
                      assertEquals(false, queue.enqueue("p1", 900))
                      assertEquals(false, queue.enqueue("p3", 0))
                      assertEquals(false, queue.enqueue("p4", -1))
                      assertEquals(listOf(Payment("p1", 500), Payment("p2", 700)), queue.pending())
                  }

                  @Test fun emptyQueueHasNoPendingOrFailedPayments() {
                      val queue = OfflineQueue(FakeSender())
                      assertEquals(emptyList<Payment>(), queue.pending())
                      assertEquals(emptyList<Payment>(), queue.failed())
                  }
              }
            reference_solution: |
              data class Payment(val id: String, val amountCents: Long)

              enum class SendResult { SUCCESS, RETRYABLE, PERMANENT }

              enum class ProcessResult { SENT, WILL_RETRY, MOVED_TO_FAILED, EMPTY }

              fun interface PaymentSender {
                  fun send(payment: Payment, idempotencyKey: String): SendResult
              }

              class OfflineQueue(private val sender: PaymentSender) {
                  private val queue = ArrayDeque<Payment>()
                  private val knownIds = mutableSetOf<String>()
                  private val failedPayments = mutableListOf<Payment>()

                  fun enqueue(id: String, amountCents: Long): Boolean {
                      if (amountCents <= 0 || id in knownIds) return false
                      knownIds += id
                      queue.addLast(Payment(id, amountCents))
                      return true
                  }

                  fun pending(): List<Payment> = queue.toList()

                  fun failed(): List<Payment> = failedPayments.toList()

                  fun processNext(): ProcessResult {
                      val payment = queue.firstOrNull() ?: return ProcessResult.EMPTY
                      return when (sender.send(payment, payment.id)) {
                          SendResult.SUCCESS -> { queue.removeFirst(); ProcessResult.SENT }
                          SendResult.RETRYABLE -> ProcessResult.WILL_RETRY
                          SendResult.PERMANENT -> {
                              queue.removeFirst()
                              failedPayments += payment
                              ProcessResult.MOVED_TO_FAILED
                          }
                      }
                  }

                  fun sync(): List<ProcessResult> {
                      val results = mutableListOf<ProcessResult>()
                      while (queue.isNotEmpty()) {
                          val result = processNext()
                          results += result
                          if (result == ProcessResult.WILL_RETRY) break
                      }
                      return results
                  }
              }
            hints:
              - Check the amount and the set of known ids before adding to the deque.
              - Store `Payment` objects in an `ArrayDeque` and return `queue.toList()`.
            expected: |
              `enqueue("p1", 500) → true · enqueue("p2", 700) → true · enqueue("p1", 900) → false · enqueue("p3", 0) → false · pending() → [p1 500, p2 700]`

          - id: kotlin-ch09-offline-part-2
            prompt: Sending goes through `PaymentSender.send(payment, idempotencyKey)`. `SUCCESS` removes the head; `RETRYABLE` keeps it at the head; `PERMANENT` moves it to a failed list. Implement `processNext()`.
            starter_code: |
              data class Payment(val id: String, val amountCents: Long)
              enum class SendResult { SUCCESS, RETRYABLE, PERMANENT }
              enum class ProcessResult { SENT, WILL_RETRY, MOVED_TO_FAILED, EMPTY }
              fun interface PaymentSender { fun send(payment: Payment, idempotencyKey: String): SendResult }

              class OfflineQueue(private val sender: PaymentSender) {
                  private val queue = ArrayDeque<Payment>()
                  private val knownIds = mutableSetOf<String>()
                  private val failedPayments = mutableListOf<Payment>()
                  fun enqueue(id: String, amountCents: Long): Boolean {
                      if (amountCents <= 0 || id in knownIds) return false
                      knownIds += id
                      queue.addLast(Payment(id, amountCents))
                      return true
                  }
                  fun pending(): List<Payment> = queue.toList()
                  fun failed(): List<Payment> = failedPayments.toList()
                  fun processNext(): ProcessResult = TODO()
                  fun sync(): List<ProcessResult> = TODO()
              }
            hidden_tests: |
              import org.junit.Test
              import org.junit.Assert.assertEquals

              class OfflineQueuePart2Test {
                  private class FakeSender(private vararg val results: SendResult) : PaymentSender {
                      private var index = 0
                      override fun send(payment: Payment, idempotencyKey: String): SendResult = results[index++]
                  }

                  @Test fun successRemovesHeadAndRetryKeepsIt() {
                      val queue = OfflineQueue(FakeSender(SendResult.SUCCESS, SendResult.RETRYABLE))
                      queue.enqueue("p1", 500); queue.enqueue("p2", 700)
                      assertEquals(ProcessResult.SENT, queue.processNext())
                      assertEquals(ProcessResult.WILL_RETRY, queue.processNext())
                      assertEquals(listOf(Payment("p2", 700)), queue.pending())
                      assertEquals(emptyList<Payment>(), queue.failed())
                  }

                  @Test fun permanentFailureMovesHeadToFailed() {
                      val queue = OfflineQueue(FakeSender(SendResult.PERMANENT))
                      queue.enqueue("p1", 100)
                      assertEquals(ProcessResult.MOVED_TO_FAILED, queue.processNext())
                      assertEquals(emptyList<Payment>(), queue.pending())
                      assertEquals(listOf(Payment("p1", 100)), queue.failed())
                  }
              }
            reference_solution: |
              data class Payment(val id: String, val amountCents: Long)
              enum class SendResult { SUCCESS, RETRYABLE, PERMANENT }
              enum class ProcessResult { SENT, WILL_RETRY, MOVED_TO_FAILED, EMPTY }
              fun interface PaymentSender { fun send(payment: Payment, idempotencyKey: String): SendResult }

              class OfflineQueue(private val sender: PaymentSender) {
                  private val queue = ArrayDeque<Payment>()
